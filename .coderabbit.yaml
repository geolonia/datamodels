# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Inherits the org-wide CodeRabbit defaults from geolonia/coderabbit. Without
# `inheritance: true` this file would replace them entirely, including the
# setting that lets CodeRabbit approve pull requests.

inheritance: true

# Public repository with international contributors: review in English.
language: en-US

# Release snapshots are byte copies of models/<subject>/ written by
# `npm run manifest:record`. CI checks them: the snapshot of the current
# version against the sources (verifyRelease in scripts/lib/releases.mjs),
# older ones against published-manifest.json. Reviewing them again only
# duplicates the model diff.
reviews:
  path_filters:
    - "!models/*/releases/**"

# Repository-specific overrides go below. Examples:
#
# language: en-US              # the org default is Japanese
#
# reviews:
#   profile: assertive         # more thorough, and noisier
#   path_filters:
#     - "!**/*.snap"
#     - "!**/fixtures/**"
#   auto_review:
#     ignore_title_keywords:
#       - "chore(deps)"
