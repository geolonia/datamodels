name: Check Worker build

# Builds the published tree and dry-runs the Worker deploy on every pull request
# and on main. It does NOT publish: Cloudflare Workers Builds watches this
# repository (Worker -> Settings -> Builds) and redeploys on merge to main, so
# no Cloudflare token lives in GitHub. See README, "Hosting and deployment".
#
# No `paths` filter on purpose: this check is meant to be required on main, and
# a filtered workflow never reports on PRs it skips, which blocks them forever.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build and dry-run deploy
    runs-on: ubuntu-latest
    # Room for the online comparison with datamodels.jp (20 s per request) when the site is slow.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Validator tests: each contract rule must fire on a broken model.
      - name: Test
        run: pnpm test

      # The Japanese pages with textlint (.textlintrc.json): the rules of
      # Geolonia's handbook; the site's two choices are in CONTRIBUTING.md.
      - name: Lint the Japanese pages
        run: pnpm run lint:ja

      # Validates models, builds dist/, checks the release snapshots and runs
      # `wrangler deploy --dry-run`, which validates wrangler.jsonc and the
      # assets directory without touching Cloudflare.
      - name: Validate, build and dry-run deploy
        run: pnpm run check

      # A pull request must not change or drop a published version (a release
      # snapshot in models/<subject>/releases/), on GitHub or online, and every
      # current version has its snapshot. Before the official launch, in-place
      # corrections are notes instead of failures (prerelease: true in node.yaml,
      # also on the base branch).
      - name: Compare the published versions with the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          pnpm exec datamodels check . --base "origin/$BASE_REF" --all-released
