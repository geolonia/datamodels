notes:
  - ja: 高松市の水防本部アプリの Custom Data Model から派生した（2026年9月。元のソースは非公開）。型名はテナント固有の接頭辞「Saitai」を外して一般化し、属性名はタスク管理のサブジェクトに合わせた。
    en: Derived from the Custom Data Models of the Takamatsu City flood-prevention headquarters application (September 2026; its source is not public). Type names generalised from the tenant-specific "Saitai" prefix; attribute names aligned with the task subject.
  - ja: 元のアプリからの変更：status → restrictionStatus（RoadSegment の値域 closed | limited | open に正規化し、現場の呼び方は statusLabel に残す。「依頼中」は通行できるので、open でラベルを「依頼中」とする）。area → location（コアの語。規制区間が規制の位置）。memo → description。平らな町・番地の項目 → address（JapaneseAddress）。
    en: "From the source application: status → restrictionStatus, normalised to the RoadSegment value space closed | limited | open, with the local wording in statusLabel (依頼中 is open with the label 依頼中: the road is still passable); area → location (core term; the closed section is the location of the closure); memo → description; the flat town and block fields → address (JapaneseAddress)."
  - ja: 検討した上流（2026-09-18）：Smart Data Models の RoadSegment（道路網のマスタで、通行止めは市が持っていない区間の状態になる）、RestrictedTrafficArea（出来事ではなく、区域の規制を表す）、Alert（配信する通知で、roadClosed はあるが道路名が無く、alertSource が必須）。どれも型としては合わない。借りたもの：restrictionStatus の値域として RoadSegment の status の値域、Transportation の roadName の IRI、Smart Data Models の validFrom・validTo。
    en: "Upstream considered (2026-09-18): Smart Data Models RoadSegment (a network master; a closure is a state of a segment the city does not have), RestrictedTrafficArea (regulation, not an incident) and Alert (a broadcast notice with roadClosed but no road name, alertSource required). None fits as a type. Borrowed: the RoadSegment status value space for restrictionStatus and the Transportation roadName IRI; validFrom/validTo from Smart Data Models."
  - ja: "公的なガイドラインを確認した（2026-09-24）。採用したもの：(1) 警察庁「交通規制情報（拡張版標準フォーマット）説明書 Ver: k_2.1」（日本道路交通情報センター（JARTIC）発行、初版 2024-04-22、改訂 2025-01-20、https://www.jartic.or.jp/d/opendata/typeD_kisei_73_k_2.1.pdf）。点規制・線規制・面規制の区分（3.5 節）を根拠に、location を LineString だけから Point・LineString・Polygon に広げた（mapping/npa-traffic-regulation-format.yaml を参照）。経度緯度 の項目はすべての規制の記録で必須なので、location も必須にした。(2) 国土交通省の道路情報提供システムの通行規制の凡例（road-info-prvs.mlit.go.jp、2026-09-24 に確認）。10 区分の凡例（通行止(異常気象等)／通行止(工事)／大型通行止／冬期通行止／車線規制／片側交互通行／移動規制／チェーン規制／チェーン指導／その他規制。サイトの表記のまま）を、新しい属性 regulationCategory の値域にした（mapping/mlit-road-info-prvs.yaml を参照）。"
    en: "Public-sector guidelines reviewed (2026-09-24). Adopted: (1) National Police Agency, 交通規制情報（拡張版標準フォーマット）説明書 Ver: k_2.1 (published by JARTIC, first edition 2024-04-22, revised 2025-01-20, https://www.jartic.or.jp/d/opendata/typeD_kisei_73_k_2.1.pdf) — its point/line/area regulation-form taxonomy (点規制・線規制・面規制, section 3.5) is the basis for widening location from LineString-only to Point/LineString/Polygon (see mapping/npa-traffic-regulation-format.yaml); its 経度緯度 field is 必須 (mandatory) for every regulation record, which is why location is now required. (2) MLIT Road Information Provision System, traffic regulation legend (road-info-prvs.mlit.go.jp, verified 2026-09-24) — its 10-category legend (通行止(異常気象等)/通行止(工事)/大型通行止/冬期通行止/車線規制/片側交互通行/移動規制/チェーン規制/チェーン指導/その他規制 — the site's own labels, verbatim) is the value space of the new regulationCategory attribute (see mapping/mlit-road-info-prvs.yaml)."
  - ja: 確認したが採用しなかったもの：(1) 総務省消防庁「災害報告取扱要領」（昭和45年4月10日消防防第246号、最終改正 平成31年4月消防応第28号、https://www.fdma.go.jp/laws/laws/items/h3104_houkoku_youryou.pdf）は、第1号様式で道路（橋りょうを除く）を災害被害の正式な区分として定めているが、都道府県単位の統計報告のための箇所数の集計でしかない。規制 1 件ごとの NGSI-LD エンティティとは粒度が違うので、属性は借りていない。(2) デジタル庁の自治体標準オープンデータセット（31 項目、2026-09-24 に https://www.digital.go.jp/resources/open_data/municipal-standard-data-set-test で確認）には、通行止めや通行規制の項目が無い。(3) SIP4D-ZIP（JSA-S1016:2023、日本規格協会）は、実際に参照されている災害情報の国の共有の枠組みだが、全文は JSA の Webdesk で有料である。通行止めの項目の定義を無料の資料で確かめられなかったので、何も採用していない。検討は続けられる。
    en: "Checked but not adopted: (1) Ministry of Internal Affairs and Communications, Fire and Disaster Management Agency (総務省消防庁) 災害報告取扱要領 (昭和45年4月10日消防防第246号, last amended 平成31年4月消防応第28号, https://www.fdma.go.jp/laws/laws/items/h3104_houkoku_youryou.pdf) does define 道路 (road, excluding bridges) as an official disaster-damage category in its 第1号様式, but only as an aggregate count of 箇所 (sites) for prefecture-level statistical reporting — a different granularity from a per-closure NGSI-LD entity, so no attribute was borrowed from it. (2) Digital Agency 自治体標準オープンデータセット (31 items, confirmed via https://www.digital.go.jp/resources/open_data/municipal-standard-data-set-test on 2026-09-24) has no road-closure or road-regulation item. (3) SIP4D-ZIP (JSA-S1016:2023, Japanese Standards Association) is a real, cited national data-sharing framework for disaster information, but its full text sits behind the JSA webdesk paywall; its road-closure field definitions could not be verified from freely available sources, so nothing was adopted from it; it remains open for review."
  - ja: 通行止めの原因（土砂崩れ、冠水、倒木など）の公的な統制語彙は、上で確認したどの資料にも無かった。警察庁のフォーマット自身も、規制理由 を 600 バイトの自由記述として持ち、コード化していない。そのため原因は、これまでどおり description の自由記述とする。
    en: No public controlled vocabulary for closure cause (landslide/flooding/fallen tree, etc.) was found anywhere reviewed above; the NPA format itself keeps its own 規制理由 (regulation reason) as 600-byte free text, uncoded. description therefore stays free text for the cause, unchanged from before.
  - ja: プレリリース中の 2026-09-25 に、災害対応のサブジェクトから交通に移し、RoadClosure から名前を変えた（#55）。国の規制区分を扱うので、災害による通行止めだけでなく、工事、冬期通行止め、車線規制、チェーン規制など通行規制全般を扱う。closureStatus は同じ値のまま restrictionStatus になった。同時に project の関係（タスク管理の Project へ）を削除した。元のアプリで、すべてのエンティティが 1 つの災害に属していたことに由来するもので、国の標準には無い。
    en: "Moved from the disaster subject to transportation and renamed from RoadClosure on 2026-09-25, during the pre-release (#55): with the national restriction categories it covers road restrictions in general (roadworks, winter closures, lane and chain restrictions), not only closures caused by disasters. closureStatus became restrictionStatus with the same values. The project relationship (to a task subject Project) was removed at the same time: it came from the source application, where every entity belonged to one disaster event, and no national standard has it."
  - ja: 規制を、たとえば災害対応の業務ごとにまとめるのはアプリケーションに任せる。タスク管理の Task が refersTo で規制を指すか、拡張したモデルが独自の関係を足す（GeonicDB のガイドの拡張の方法を参照）。
    en: "Grouping restrictions, for example by disaster-response operation, is left to the application: a task subject Task points at a restriction with refersTo, or an extended model adds its own relationship (see the extension pattern in the GeonicDB guide)."
  - ja: "2026-10-02、プレリリース中に restrictionLength（規制区間の延長、m）と maximumAllowedWeight（重量制限、kg）を足した（#149）。和歌山県の道路規制情報（実データ 34 件、#85）にあり、ほかの標準にもあるもの: 延長は警察庁フォーマット（項目133）と EEI、重量制限は警察庁フォーマット（項目135、t）と Smart Data Models RoadSegment（同じ IRI）。和歌山県のデータにしか無い方向（上り・下り）、う回路、問い合わせ先は足さず、description に書く。警察庁フォーマットは方向を座標で表す。Smart Data Models の roadWork（LANDSLIDE、FLOOD などの原因）は検討したが、日本の資料に当たる区分が無いので採らない。"
    en: "Added during the pre-release on 2026-10-02 (#149): restrictionLength (length of the regulated section, metres) and maximumAllowedWeight (weight limit, kilograms). Wakayama Prefecture's road restriction data (34 real records, #85) has them, and so do other standards: the length is in the NPA format (item 133) and EEI, the weight limit in the NPA format (item 135, tonnes) and Smart Data Models RoadSegment (same IRI). Direction (上り/下り), detour and contact are only in Wakayama's data, so they are not added and go into description; the NPA format gives direction as coordinates. Smart Data Models' roadWork (causes such as LANDSLIDE, FLOOD) was considered but not adopted: no Japanese source has matching categories."
