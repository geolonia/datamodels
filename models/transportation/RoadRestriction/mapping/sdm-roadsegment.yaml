standard:
  name:
    ja: Smart Data Models RoadSegment（dataModel.Transportation）
    en: Smart Data Models RoadSegment (dataModel.Transportation)
  url: https://github.com/smart-data-models/dataModel.Transportation/tree/master/RoadSegment
  note:
    ja: RoadSegment は道路網の区間マスタ。通行止めはその区間の状態（status）に相当し、値域と roadName の IRI を借りている。区間マスタを持たない自治体向けに、ここでは通行止めそのものをエンティティにしている。
    en: RoadSegment is a road-network master; a closure corresponds to the status of a segment. This type borrows the status value space and the roadName IRI, and models the closure itself for municipalities that have no segment master.
fields:
  roadName:
    to: roadName
    note:
      ja: 同じ IRI
      en: same IRI
  address:
    to: null
  location:
    to: location
    note:
      ja: RoadSegment は区間（LineString）全体、ここでは点・線・面いずれもとりうる規制区間
      en: RoadSegment's location is a LineString for the whole segment; here it can be a point, line or area regulated section
  restrictionStatus:
    to: status
    note:
      ja: 同じ値域 closed / limited / open
      en: same value space closed / limited / open
  regulationCategory:
    to: null
    note:
      ja: RoadSegment には無い。国土交通省の道路情報提供システムから採る（mlit-road-info-prvs.yaml 参照）
      en: not in RoadSegment; comes from MLIT's Road Information Provision System (see mlit-road-info-prvs.yaml)
  statusLabel:
    to: statusDescription
  validFrom:
    to: null
  validTo:
    to: null
  description:
    to: null
