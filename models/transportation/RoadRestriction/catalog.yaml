title:
  ja: 通行規制
  en: Road restriction
description:
  ja: 通行規制（通行止めを含む）1 件。路線名、規制区間（点・線・面）、状態、区分、期間を持つ。
  en: "One road restriction, including closures: road name, regulated section (point, line or area), status, category and period."
status: draft
tags:
  - road
  - traffic-restriction
  - municipality
attributes:
  roadName:
    ja: 路線名
    en: Road name
  roadType:
    ja: "道路法第3条の道路の種類: expressway（高速自動車国道）、nationalRoad（一般国道）、prefecturalRoad（都道府県道）、municipalRoad（市町村道）、other（農道・林道・私道など道路法の道路でないもの）。自動車専用道路は種類ではなく指定なので、その道路の種類を入れる"
    en: "Road class by the Road Act (Art. 3): expressway, nationalRoad, prefecturalRoad, municipalRoad, or other for a road outside the Act (farm, forest or private road). A motorway designation (自動車専用道路) is not a class: give the class of the road it is on"
  address:
    ja: 住所（common サブジェクトの JapaneseAddress 値）
    en: Address, as a JapaneseAddress value from the common subject
  location:
    ja: 規制区間。点（単独地点）・線（区間）・面（区域）の GeoJSON ジオメトリ。警察庁「交通規制情報（拡張版標準フォーマット）」の点規制・線規制・面規制に対応
    en: The regulated section, as a GeoJSON geometry (point, line or area), matching the point/line/area regulation forms of the NPA's traffic regulation data format
  restrictionLength:
    ja: 線規制の規制区間の延長（m）。警察庁「交通規制情報（拡張版標準フォーマット）」の距離・延長（項目133）、EEI の距離・延長に当たる。ジオメトリが簡略化されていても延長が分かる
    en: Length of the regulated section in metres, for a line. The NPA format's 距離・延長 (item 133) and EEI's 距離・延長; known even when the geometry is simplified
  maximumAllowedWeight:
    ja: 重量制限（kg）。これより重い車両は通れない（例 「4t車以上通行止」なら 4000）。Smart Data Models RoadSegment と同じ属性。警察庁フォーマットでは制限重量（項目135、単位 t）。車両総重量か最大積載量かは元データに従い、その呼び方は statusLabel に残す
    en: "Weight limit in kilograms: vehicles heavier than this may not pass (for example 4000 for 4t車以上通行止). The same term as Smart Data Models RoadSegment; the NPA format gives it in tonnes (制限重量, item 135). Whether it is gross weight or payload follows the source; keep its wording in statusLabel"
  restrictionStatus:
    ja: "正規化した状態。Smart Data Models RoadSegment.status の値域: closed（通行不可）、limited（片側通行など）、open（解除済み、または未実施）。現場の呼び方は statusLabel に。より細かい区分は regulationCategory に。値域に合う値がないときは省き、statusLabel だけを送る"
    en: "Normalised restriction state, the value space of Smart Data Models RoadSegment.status: closed (no traffic), limited (traffic possible but not in full capacity), open (restriction lifted or not yet in place). The local wording goes in statusLabel; a finer public-sector category goes in regulationCategory. When no value fits, leave it out and send only statusLabel"
  regulationCategory:
    ja: "規制区分。国土交通省 道路情報提供システムの凡例（表記はサイトの凡例に合わせた）: closedWeather（通行止(異常気象等)）、closedConstruction（通行止(工事)）、closedHeavyVehicle（大型通行止）、closedWinter（冬期通行止）、laneRestriction（車線規制）、alternatingOneWay（片側交互通行）、mobileRestriction（移動規制）、chainRestriction（チェーン規制）、chainGuidance（チェーン指導）、other（その他規制）。closedWeather は土砂崩落や路肩決壊など災害による通行止めも含む。任意項目"
    en: "Regulation category, from the legend of MLIT's Road Information Provision System: closedWeather, closedConstruction, closedHeavyVehicle, closedWinter, laneRestriction, alternatingOneWay, mobileRestriction, chainRestriction, chainGuidance, other. closedWeather also covers closures after a disaster, such as a landslide or a collapsed road shoulder. Optional"
  statusLabel:
    ja: 状態の現場や元のシステムでの呼び方（例 依頼中、通行止め中、解除済み）。restrictionStatus を省いたときは必須
    en: The restriction status in the local or source system's wording (e.g. 依頼中, 通行止め中, 解除済み). Required when restrictionStatus is left out
  validFrom:
    ja: 規制開始
    en: When the restriction takes effect
  validTo:
    ja: 解除
    en: When the restriction is lifted
  description:
    ja: メモ
    en: Free-text memo
