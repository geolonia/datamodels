title:
  ja: "医療機関"
  en: "Medical institution"
description:
  ja: "病院または診療所 1 か所のデータです。自治体が「医療機関一覧」（自治体標準オープンデータセット 10）として公開する一覧の 1 行にあたります。Facility の下位の型で、医療機関の種類、医療機関コード、診療科目、病床数、災害時の医療での役割（災害拠点分類）、時間外の対応を足しています。診療日と診療時間は openingHoursSpecification に入ります。"
  en: "One hospital or clinic: one row of the list a municipality publishes as 自治体標準オープンデータセット dataset 10 (医療機関一覧). A subtype of Facility that adds the kind of institution, the medical institution code, clinical departments, number of beds, its role in disaster medical care (災害拠点分類) and after-hours care. Consultation days and hours go into openingHoursSpecification."
status: draft
tags:
  - facility
  - disaster-response
  - health
  - municipality
attributes:
  name:
    ja: "施設の名称"
    en: "Name of the facility"
  nameKana:
    ja: "名称のカナ表記（全角カタカナ）"
    en: "Name in full-width katakana"
  nameEn:
    ja: "名称の英語表記"
    en: "Name in English"
  externalFacilityId:
    ja: "自治体の一覧での ID（自治体とデータセットの中で一意）。localGovernmentCode と合わせると、全国で一意になります。"
    en: "The facility's ID in the municipality's list (unique within the municipality and the dataset). Together with localGovernmentCode it is unique nationwide"
  localGovernmentCode:
    ja: "一覧を公開する自治体の全国地方公共団体コード（検査数字を含む 6 桁）"
    en: "Local government code (6 digits including the check digit) of the municipality that publishes the list"
  address:
    ja: "所在地（JapaneseAddress）。その localGovernmentCode は所在地の自治体のもので、公開する自治体とは違うことがあります。"
    en: "Address of the facility (JapaneseAddress). Its localGovernmentCode is that of the municipality the facility lies in, which can differ from the publisher"
  location:
    ja: "位置（点）"
    en: "Location (a point)"
  operatorName:
    ja: "施設を運営する組織の名称。AED のような設備では、設置した組織です（データセットの「団体名」「法人の名称」）。"
    en: "Name of the organisation that runs the facility or, for equipment such as an AED, installed it (団体名, 法人の名称 in the datasets)"
  corporateNumber:
    ja: "施設を運営する組織、または設備を設置した組織の法人番号（国税庁、13 桁）"
    en: "Corporate number (13 digits, National Tax Agency) of the organisation that runs the facility or installed the equipment"
  contactPoint:
    ja: "連絡先（ContactPoint）：電話番号、内線番号、FAX 番号、メールアドレス、問い合わせフォーム、そのほかの連絡手段、郵便番号"
    en: "How to get in touch (ContactPoint): telephone, extension, fax, e-mail, web form, other channels, postal code"
  openingHoursSpecification:
    ja: "利用できる時間（OpeningHours）：曜日、開始時刻、終了時刻、特記事項"
    en: "When the facility can be used (OpeningHours): weekdays, opening and closing time, remarks"
  url:
    ja: "施設についてのウェブページ"
    en: "Web page about the facility"
  remarks:
    ja: "備考"
    en: "Remarks"
  medicalInstitutionType:
    ja: "医療機関の種類。hospital（病院、20 床以上）、clinicWithBeds（有床診療所、1〜19 床）、clinicWithoutBeds（無床診療所）、clinic（診療所。一覧が病床の有無を書いていないもの）、dentalClinic（歯科診療所）"
    en: "Kind of medical institution: hospital (20 beds or more), clinicWithBeds (1 to 19 beds), clinicWithoutBeds (no beds), clinic (a clinic whose list does not say whether it has beds), dentalClinic (a dental clinic)"
  medicalInstitutionCode:
    ja: "医療機関コード。データセットのとおりに書きます（定義書の記入例は 10 桁）。"
    en: "Medical institution code, as the dataset gives it (the example in the definition sheet has 10 digits)"
  medicalDepartments:
    ja: "診療科目。公開者が書いたとおりの名前です（例：内科、整形外科）。"
    en: "Clinical departments, as written by the publisher, for example 内科 or 整形外科"
  numberOfBeds:
    ja: "病床数"
    en: "Number of beds"
  disasterBaseClass:
    ja: "災害時の医療での役割（災害拠点分類）。core（基幹災害医療センター）、regional（地域災害医療センター）、firstAidStation（救護所）"
    en: "The institution's role in disaster medical care: core (core disaster base hospital), regional (regional disaster base hospital), firstAidStation (first-aid station)"
  afterHoursCare:
    ja: "診療時間外の対応（文章）"
    en: "What the institution does outside its consultation hours, in words"
