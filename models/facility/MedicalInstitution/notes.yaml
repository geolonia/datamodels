notes:
  - ja: "デジタル庁の自治体標準オープンデータセット、データ項目定義書 A（2026-08-01、2026-10-11 に確認）のシート「10 医療機関一覧」（https://www.digital.go.jp/resources/open_data/municipal-standard-data-set-test ）に基づいています。項目ごとの対応は mapping/jichitai-opendata-medical.yaml にあります。"
    en: Built on the Digital Agency's 自治体標準オープンデータセット, data item definition sheet A (2026-08-01, checked 2026-10-11), sheet 10 医療機関一覧 (https://www.digital.go.jp/resources/open_data/municipal-standard-data-set-test). Field by field in mapping/jichitai-opendata-medical.yaml.
  - ja: "Facility の下位の型（x-subclass-of）です。足しているのは、このデータセットだけの列（医療機関の種類、医療機関コード、診療科目、病床数、災害拠点分類、時間外における対応）です。診療曜日と診療時間は openingHoursSpecification に、FAX 番号は contactPoint に入ります。"
    en: "A subtype (x-subclass-of) of Facility that adds the columns of this dataset only: kind of institution, medical institution code, clinical departments, number of beds, disaster base class and after-hours care. Consultation days and hours go into openingHoursSpecification, the fax number into contactPoint."
  - ja: "医療機関の種類と災害拠点分類の値は、定義書の値の一覧に対応します（病院 → hospital など）。災害拠点分類の一覧と記入例は「期間災害医療センター」と書いていますが、「基幹」の誤りと読んで core にしています。いまの国の呼び方では、基幹災害拠点病院と地域災害拠点病院です。「状況」（status）の列は、定義も値の一覧も無く、NGSI-LD のコアの用語と同じ名前なので入れていません。"
    en: "The kind of institution and the disaster base class take values after the definition sheet's value lists (病院 → hospital and so on). The disaster base class list and example write 期間災害医療センター, read as a typo for 基幹 (core); the current national terms are 基幹災害拠点病院 and 地域災害拠点病院. The 状況 (status) column is left out: it has no definition or value list, and its name is an NGSI-LD core term."
  - ja: "検討した上流（2026-10-11）：schema.org の MedicalOrganization、Hospital、MedicalClinic は意味が近く、medicalSpecialty もあります。ただし medicalSpecialty の値は schema.org の MedicalSpecialty の列挙で、日本の診療科名とは合いません。型を変えて使うことはできないので、診療科目は medicalDepartments（文字列の配列）として定めました。病床数は、schema.org の numberOfBeds がホテルの部屋のベッドの数なので、別に定めています。Smart Data Models には病院の型がありません。"
    en: "Upstream considered (2026-10-11): schema.org MedicalOrganization, Hospital and MedicalClinic are close in meaning and have medicalSpecialty, but its values are members of the schema.org MedicalSpecialty enumeration, which do not match Japanese department names; changing an upstream term's type is not allowed, so departments are medicalDepartments, an array of strings. The number of beds is minted too: schema.org numberOfBeds counts beds in a hotel room. Smart Data Models has no hospital type."
  - ja: "例のデータ（三井記念病院）は、次の公開情報から取っています（どれも 2026-10-11 に確認）。病床数と災害拠点病院であることは、東京都保健医療局「東京都災害拠点病院一覧」（令和 6 年 8 月 1 日現在）からです。法人の名称、カナ、法人番号は国税庁の法人番号公表サイトから、郵便番号、電話番号、診療科は病院のウェブサイトから、座標は国土地理院の住所検索（神田和泉町 1 番地）から取りました。ID は架空です。千代田区は医療機関一覧を東京都オープンデータカタログに公開していません（2026-10-11 に確認）。"
    en: "The example (三井記念病院) comes from published sources, all checked 2026-10-11: the number of beds and the disaster base status from the Tokyo Metropolitan Government's 東京都災害拠点病院一覧 (as of 2024-08-01); the corporation's name, kana and corporate number from the National Tax Agency's corporate number site; the postal code, telephone and departments from the hospital's website; the coordinates from GSI's address search (神田和泉町 1番地). The ID is invented. Chiyoda City does not publish a medical institution list on the Tokyo open data catalog (checked 2026-10-11)."
  - ja: "実データ（中央区「医療機関一覧」、2026-10-11 に確認、1331 行）で見つかったこと：医療機関の種類は、定義書の一覧に無い「一般診療所」「歯科診療所」「企業内診療所」で書かれています。病床数には「有り」と書かれた行が 4 つあり、変換ツールはその行を無効にします。災害拠点分類、診療曜日、診療時間は空です。ID の列は指数の形（1.31025E+11）なので、変換ツール（v0.3.6）は ID が直るまで 1331 行すべてを無効にします。試しに ID を行番号に置き換えると、1327 行が有効で、無効なのは病床数が「有り」の 4 行です（2026-10-12 に確認）。値の一覧は変えません（2026-10-11 の決定）。ほかの自治体も同じように定義書に無い種類を使っていれば、一覧を見直します。"
    en: "Real data seen (Chuo City's 医療機関一覧, checked 2026-10-11, 1331 rows): the kind of institution is written as 一般診療所, 歯科診療所 and 企業内診療所, none of which is in the definition sheet's list; four rows have 有り (yes) as the number of beds, and the converter rejects them; the disaster base class, consultation days and hours are empty. The ID column holds a number in exponent form (1.31025E+11), so the converter (v0.3.6) rejects all 1331 rows until the IDs are fixed; with the IDs replaced by row numbers as a test, 1327 rows are valid and only the four with 有り as the number of beds are not (checked 2026-10-12). The value list stays as it is (decided 2026-10-11); it is revisited if a second municipality also uses kinds that the definition sheet does not list."
  - ja: "医療機関の種類は、対応表（mapping/jichitai-opendata-medical.yaml）で変換しません（2026-10-12 の決定）。中央区の書き方（一般診療所、歯科診療所、企業内診療所）は定義書の 3 つの値のどれでもないので、変換すると中央区の 1331 行すべてが無効になるためです。定義書の値で書く自治体が増えれば見直します。災害拠点分類は values で変換し、定義書の「期間災害医療センター」も core にします。"
    en: "The mapping (mapping/jichitai-opendata-medical.yaml) does not convert the kind of institution (decided 2026-10-12): Chuo City writes 一般診療所, 歯科診療所 and 企業内診療所, none of the definition sheet's three values, so converting the column would make all 1331 of its rows invalid. This is revisited if more municipalities write the sheet's values. The disaster base class is converted with values, and the sheet's 期間災害医療センター becomes core too."
