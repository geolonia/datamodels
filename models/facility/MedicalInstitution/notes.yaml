notes:
  - ja: "デジタル庁の自治体標準オープンデータセット、データ項目定義書 A（2026-08-01、2026-10-11 に確認）のシート「10 医療機関一覧」（https://www.digital.go.jp/resources/open_data/municipal-standard-data-set-test ）に基づいています。項目ごとの対応は mapping/jichitai-opendata-medical.yaml にあります。"
    en: Built on the Digital Agency's 自治体標準オープンデータセット, data item definition sheet A (2026-08-01, checked 2026-10-11), sheet 10 医療機関一覧 (https://www.digital.go.jp/resources/open_data/municipal-standard-data-set-test). Field by field in mapping/jichitai-opendata-medical.yaml.
  - ja: "Facility の下位の型（x-subclass-of）です。足しているのは、このデータセットだけの列（医療機関の種類、医療機関コード、診療科目、病床数、災害拠点分類、時間外における対応）です。診療曜日と診療時間は openingHoursSpecification に、FAX 番号は contactPoint に入ります。"
    en: "A subtype (x-subclass-of) of Facility that adds the columns of this dataset only: kind of institution, medical institution code, clinical departments, number of beds, disaster base class and after-hours care. Consultation days and hours go into openingHoursSpecification, the fax number into contactPoint."
  - ja: "医療機関の種類と災害拠点分類の値は、定義書の値の一覧に対応します（病院 → hospital など）。医療機関の種類には、定義書に無い clinic と dentalClinic も足しています（実データの項を参照）。災害拠点分類の一覧と記入例は「期間災害医療センター」と書いていますが、「基幹」の誤りと読んで core にしています。いまの国の呼び方では、基幹災害拠点病院と地域災害拠点病院です。「状況」（status）の列は、定義も値の一覧も無く、NGSI-LD のコアの用語と同じ名前なので入れていません。"
    en: "The kind of institution and the disaster base class take values after the definition sheet's value lists (病院 → hospital and so on); the kind of institution also has clinic and dentalClinic, which the sheet does not list (see the real data note). The disaster base class list and example write 期間災害医療センター, read as a typo for 基幹 (core); the current national terms are 基幹災害拠点病院 and 地域災害拠点病院. The 状況 (status) column is left out: it has no definition or value list, and its name is an NGSI-LD core term."
  - ja: "検討した上流（2026-10-11）：schema.org の MedicalOrganization、Hospital、MedicalClinic は意味が近く、medicalSpecialty もあります。ただし medicalSpecialty の値は schema.org の MedicalSpecialty の列挙で、日本の診療科名とは合いません。型を変えて使うことはできないので、診療科目は medicalDepartments（文字列の配列）として定めました。病床数は、schema.org の numberOfBeds がホテルの部屋のベッドの数なので、別に定めています。Smart Data Models には病院の型がありません。"
    en: "Upstream considered (2026-10-11): schema.org MedicalOrganization, Hospital and MedicalClinic are close in meaning and have medicalSpecialty, but its values are members of the schema.org MedicalSpecialty enumeration, which do not match Japanese department names; changing an upstream term's type is not allowed, so departments are medicalDepartments, an array of strings. The number of beds is minted too: schema.org numberOfBeds counts beds in a hotel room. Smart Data Models has no hospital type."
  - ja: "例のデータ（三井記念病院）は、次の公開情報から取っています（どれも 2026-10-11 に確認）。病床数と災害拠点病院であることは、東京都保健医療局「東京都災害拠点病院一覧」（令和 6 年 8 月 1 日現在）からです。法人の名称、カナ、法人番号は国税庁の法人番号公表サイトから、郵便番号、電話番号、診療科は病院のウェブサイトから、座標は国土地理院の住所検索（神田和泉町 1 番地）から取りました。ID は架空です。千代田区は医療機関一覧を東京都オープンデータカタログに公開していません（2026-10-11 に確認）。"
    en: "The example (三井記念病院) comes from published sources, all checked 2026-10-11: the number of beds and the disaster base status from the Tokyo Metropolitan Government's 東京都災害拠点病院一覧 (as of 2024-08-01); the corporation's name, kana and corporate number from the National Tax Agency's corporate number site; the postal code, telephone and departments from the hospital's website; the coordinates from GSI's address search (神田和泉町 1番地). The ID is invented. Chiyoda City does not publish a medical institution list on the Tokyo open data catalog (checked 2026-10-11)."
  - ja: "実データで見つかったこと（中央区の「医療機関一覧」は 2026-10-11 と 2026-10-12、中野区と新宿区のものは 2026-10-12 に確認）：医療機関の種類を、定義書の 3 つの値（病院、有床診療所、無床診療所）ではなく、病床の有無を書かない「診療所」で書く一覧が多くあります。中央区は「一般診療所」「歯科診療所」「企業内診療所」（1331 行、病院は無し）、中野区は「病院」「診療所」「歯科診療所」（592 行）、新宿区は 695 行すべてが「診療所」です。そこで値の一覧に clinic（診療所。病床の有無は分からない）と dentalClinic（歯科診療所）を足しました（2026-10-12 の決定）。企業内診療所は、企業が主に社員のために設ける診療所で、医療法の上では診療所です。別の値にはせず clinic にしています。中央区の一覧ではほかに、病床数に「有り」と書かれた行が 4 つあり、変換ツールはその行を無効にします。災害拠点分類、診療曜日、診療時間は空です。ID の列は指数の形（1.31025E+11）なので、変換ツール（v0.3.6）は ID が直るまで 1331 行すべてを無効にします。中野区の一覧は定義書の列（全国地方公共団体コード、ID など）に沿っていないので、この対応表では変換できません。"
    en: "Real data seen (Chuo City's 医療機関一覧 checked 2026-10-11 and 2026-10-12, Nakano's and Shinjuku's 2026-10-12): many lists write the kind of institution as 診療所 (clinic) without saying whether it has beds, instead of the definition sheet's three values (病院, 有床診療所, 無床診療所). Chuo writes 一般診療所, 歯科診療所 and 企業内診療所 (1331 rows, no hospitals), Nakano 病院, 診療所 and 歯科診療所 (592 rows), and Shinjuku 診療所 on all 695 rows. So the value list has two more values: clinic (a clinic, beds not known) and dentalClinic (a dental clinic) (decided 2026-10-12). 企業内診療所 is a clinic that a company runs mainly for its staff; under the Medical Care Act it is a clinic, so it is clinic, not a value of its own. Chuo's list also has four rows with 有り (yes) as the number of beds, and the converter rejects them; the disaster base class, consultation days and hours are empty. Its ID column holds a number in exponent form (1.31025E+11), so the converter (v0.3.6) rejects all 1331 rows until the IDs are fixed. Nakano's list does not follow the definition sheet's columns (全国地方公共団体コード, ID and others), so this mapping cannot convert it."
  - ja: "対応表（mapping/jichitai-opendata-medical.yaml）は医療機関の種類を values で変換します（2026-10-12 の決定）：病院 → hospital、有床診療所 → clinicWithBeds、無床診療所 → clinicWithoutBeds、診療所と一般診療所 → clinic、歯科診療所 → dentalClinic、企業内診療所 → clinic。これ以外の書き方は、その行の問題として報告されます。変換ツール（v0.3.6）での結果（2026-10-12 に確認）：新宿区は 695 行すべてが有効で、どれも clinic です。中央区は、試しに ID を行番号に置き換えると 1331 行のうち 1327 行が有効で、clinic が 859 行、dentalClinic が 468 行です。無効なのは病床数が「有り」の 4 行（どれも一般診療所）だけです。災害拠点分類も values で変換し、定義書の「期間災害医療センター」も core にします。"
    en: "The mapping (mapping/jichitai-opendata-medical.yaml) converts the kind of institution with values (decided 2026-10-12): 病院 → hospital, 有床診療所 → clinicWithBeds, 無床診療所 → clinicWithoutBeds, 診療所 and 一般診療所 → clinic, 歯科診療所 → dentalClinic, 企業内診療所 → clinic. Any other text is reported as a problem of the row. With the converter (v0.3.6, checked 2026-10-12): all 695 Shinjuku rows are valid and clinic; Chuo, with the IDs replaced by row numbers as a test, has 1327 of 1331 rows valid, 859 clinic and 468 dentalClinic, and only the four rows with 有り as the number of beds (all 一般診療所) are not. The disaster base class is converted with values too, and the sheet's 期間災害医療センター becomes core."
