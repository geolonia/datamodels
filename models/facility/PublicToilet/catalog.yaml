title:
  ja: "公衆トイレ"
  en: "Public toilet"
description:
  ja: "公衆トイレ 1 か所のデータです。自治体が「公衆トイレ一覧」（自治体標準オープンデータセット 13）として公開する一覧の 1 行にあたります。Facility の下位の型で、設置位置、種類ごとのトイレの数、バリアフリートイレ、車椅子使用者用、乳幼児用、オストメイト用の設備を足しています。"
  en: "One public toilet: one row of the list a municipality publishes as 自治体標準オープンデータセット dataset 13 (公衆トイレ一覧). A subtype of Facility that adds the installation location, the number of toilets by kind, and barrier-free, wheelchair, baby-care and ostomate facilities."
status: draft
tags:
  - facility
  - disaster-response
  - municipality
attributes:
  name:
    ja: "トイレの名称。駅や公園など、トイレがある施設の名称のことがあります。"
    en: "Name of the toilet; it can be the name of the station, park or other place where the toilet is"
  nameKana:
    ja: "名称のカナ表記（全角カタカナ）"
    en: "Name in full-width katakana"
  nameEn:
    ja: "名称の英語表記"
    en: "Name in English"
  externalFacilityId:
    ja: "自治体の一覧での ID（自治体とデータセットの中で一意）。localGovernmentCode と合わせると、全国で一意になります。"
    en: "The facility's ID in the municipality's list (unique within the municipality and the dataset). Together with localGovernmentCode it is unique nationwide"
  localGovernmentCode:
    ja: "一覧を公開する自治体の全国地方公共団体コード（検査数字を含む 6 桁）"
    en: "Local government code (6 digits including the check digit) of the municipality that publishes the list"
  address:
    ja: "所在地（JapaneseAddress）。その localGovernmentCode は所在地の自治体のもので、公開する自治体とは違うことがあります。"
    en: "Address of the facility (JapaneseAddress). Its localGovernmentCode is that of the municipality the facility lies in, which can differ from the publisher"
  location:
    ja: "位置（点）"
    en: "Location (a point)"
  installationLocation:
    ja: "トイレがある場所（例：駅のどの改札の近くか）。データセットは、名称と設置位置で 1 つのトイレを区別します。"
    en: "Where the toilet is, for example at which exit of a station. The dataset tells toilets apart by name and installation location"
  operatorName:
    ja: "施設を運営する組織の名称。AED のような設備では、設置した組織です（データセットの「団体名」「法人の名称」）。"
    en: "Name of the organisation that runs the facility or, for equipment such as an AED, installed it (団体名, 法人の名称 in the datasets)"
  corporateNumber:
    ja: "施設を運営する組織、または設備を設置した組織の法人番号（国税庁、13 桁）"
    en: "Corporate number (13 digits, National Tax Agency) of the organisation that runs the facility or installed the equipment"
  contactPoint:
    ja: "連絡先（ContactPoint）：電話番号、内線番号、FAX 番号、メールアドレス、問い合わせフォーム、そのほかの連絡手段、郵便番号"
    en: "How to get in touch (ContactPoint): telephone, extension, fax, e-mail, web form, other channels, postal code"
  openingHoursSpecification:
    ja: "利用できる時間（OpeningHours）：曜日、開始時刻、終了時刻、特記事項"
    en: "When the facility can be used (OpeningHours): weekdays, opening and closing time, remarks"
  url:
    ja: "施設についてのウェブページ"
    en: "Web page about the facility"
  remarks:
    ja: "備考"
    en: "Remarks"
  totalMaleToilets:
    ja: "男性トイレの総数（小便器を含む）"
    en: "Number of toilets in the men's toilet, urinals included"
  maleUrinals:
    ja: "男性トイレの小便器の数"
    en: "Number of urinals in the men's toilet"
  maleJapaneseStyleToilets:
    ja: "男性トイレの和式の数"
    en: "Number of Japanese-style (squat) toilets in the men's toilet"
  maleWesternStyleToilets:
    ja: "男性トイレの洋式の数"
    en: "Number of Western-style (sitting) toilets in the men's toilet"
  totalFemaleToilets:
    ja: "女性トイレの総数"
    en: "Number of toilets in the women's toilet"
  femaleJapaneseStyleToilets:
    ja: "女性トイレの和式の数"
    en: "Number of Japanese-style (squat) toilets in the women's toilet"
  femaleWesternStyleToilets:
    ja: "女性トイレの洋式の数"
    en: "Number of Western-style (sitting) toilets in the women's toilet"
  totalUnisexToilets:
    ja: "男女共用トイレの総数"
    en: "Number of all-gender toilets"
  unisexJapaneseStyleToilets:
    ja: "男女共用トイレの和式の数"
    en: "Number of all-gender Japanese-style (squat) toilets"
  unisexWesternStyleToilets:
    ja: "男女共用トイレの洋式の数"
    en: "Number of all-gender Western-style (sitting) toilets"
  barrierFreeToilets:
    ja: "バリアフリートイレの数。公共交通移動等円滑化基準の第 13 条第 2 項に合うトイレか、自治体が多目的トイレやバリアフリートイレとして定めるものです。"
    en: "Number of barrier-free toilets: toilets that meet Art. 13(2) of the barrier-free standard for public transport, or that the municipality defines as multipurpose or barrier-free toilets"
  wheelchairToilet:
    ja: "車椅子使用者用のトイレがあれば true"
    en: "true when there is a toilet for wheelchair users"
  babyCareToilet:
    ja: "おむつ交換台やベビーチェアなど、乳幼児用の設備を備えたトイレがあれば true"
    en: "true when there is a toilet with equipment for babies, such as a changing table or a baby seat"
  ostomateToilet:
    ja: "オストメイト用の設備を備えたトイレがあれば true"
    en: "true when there is a toilet for ostomates"
