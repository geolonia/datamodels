notes:
  - ja: "デジタル庁の自治体標準オープンデータセット、データ項目定義書 A（2026-08-01、2026-10-11 に確認）のシート「13 公衆トイレ一覧」（https://www.digital.go.jp/resources/open_data/municipal-standard-data-set-test）に基づいています。項目ごとの対応は mapping/jichitai-opendata-toilet.yaml にあります。"
    en: Built on the Digital Agency's 自治体標準オープンデータセット, data item definition sheet A (2026-08-01, checked 2026-10-11), sheet 13 公衆トイレ一覧 (https://www.digital.go.jp/resources/open_data/municipal-standard-data-set-test). Field by field in mapping/jichitai-opendata-toilet.yaml.
  - ja: "Facility の下位の型（x-subclass-of）です。足しているのは、このデータセットだけの列（設置位置、種類ごとのトイレの数、バリアフリートイレの数、車椅子使用者用・乳幼児用・オストメイト用のトイレの有無）です。このデータセットには、連絡先、法人番号、URL、曜日の列がありません。トイレの数は、データセットの列ごとに 1 つの整数の属性にしています。"
    en: "A subtype (x-subclass-of) of Facility that adds the columns of this dataset only: installation location, the number of toilets by kind, the number of barrier-free toilets, and whether there are toilets for wheelchair users, babies and ostomates. The dataset has no contact, corporate number, URL or weekday column. Each count column is one integer attribute."
  - ja: "定義書では、女性トイレ数（和式）から男女共用トイレ総数までの 3 項目の英語名が 1 つずつずれています（女性トイレ数（和式）が urinalFemaleToilet）。属性の名前は日本語名の意味に合わせ、対応表も日本語名で対応させています。"
    en: The definition sheet's English names of three items, 女性トイレ数（和式） to 男女共用トイレ総数, are shifted by one (女性トイレ数（和式） is urinalFemaleToilet). The attribute names follow the meaning of the Japanese names, and the mapping matches on them.
  - ja: "実データ（千代田区「公衆トイレ一覧」、東京都オープンデータカタログ、2025-12-12 更新、2026-10-11 に確認、37 行）で見つかったこと：総数の列が空で、内訳だけが入っている行があります。「所在地_番地以下」の多くは表計算ソフトで日付に変わっています（1-1 → 1月1日）。名称の文字の間に空白が入った行や、同じ ID が 2 行に使われているところもあります。住所の変換は「所在地_連結表記」を使うので、番地以下の崩れは影響しません。ID の重複は変換ツールでは見つかりません。"
    en: "Real data seen (Chiyoda City's 公衆トイレ一覧 on the Tokyo open data catalog, updated 2025-12-12, checked 2026-10-11, 37 rows): the total columns can be empty while the breakdown is filled; most 所在地_番地以下 values were turned into dates by a spreadsheet (1-1 became 1月1日); some names have spaces between the characters, and one ID is used on two rows. The address conversion reads 所在地_連結表記, so the broken 番地以下 does no harm; the converter does not catch a repeated ID."
  - ja: "検討した上流（2026-10-11）：schema.org の PublicToilet（CivicStructure の下位）は、意味は同じですが、トイレの数や設備を表す属性がありません。Smart Data Models には公衆トイレの型がありません。"
    en: "Upstream considered (2026-10-11): schema.org PublicToilet (under CivicStructure) has the same meaning but no attributes for the counts or the equipment. Smart Data Models has no public toilet type."
