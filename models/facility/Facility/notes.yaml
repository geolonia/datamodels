notes:
  - ja: "デジタル庁の自治体標準オープンデータセット、データ項目定義書 A（2026-08-01、2026-10-11 に確認、https://www.digital.go.jp/resources/open_data/municipal-standard-data-set-test ）に基づいています。施設のデータセットは 8 つあります（01 公共施設、05 子育て施設、08 AED、09 介護サービス事業所、10 医療機関、11 観光施設、13 公衆トイレ、14 消防水利施設）。このモデルは、その 8 つに共通する列を持ちます。もう 1 つの基は、GIF のコアデータモデル「施設」（438_コアデータモデル_DMD.xlsx、2026-10-11 に確認）です。データセットは、列ごとに GIF の施設を参照しています。GIF との対応は mapping/gif-facility.yaml にあります。"
    en: "Built on the columns that the eight facility datasets of the Digital Agency's 自治体標準オープンデータセット share (data item definition sheet A, 2026-08-01, checked 2026-10-11, https://www.digital.go.jp/resources/open_data/municipal-standard-data-set-test: 01 public facilities, 05 childcare facilities, 08 AEDs, 09 care service providers, 10 medical institutions, 11 tourist facilities, 13 public toilets, 14 fire water supplies), and on GIF's core data model 施設 (438_コアデータモデル_DMD.xlsx, checked 2026-10-11), which the datasets reference column by column. The GIF correspondence is in mapping/gif-facility.yaml."
  - ja: "データセットごとに下位の型（x-subclass-of）を作ります。最初の下位の型は AEDLocation、PublicToilet、MedicalInstitution で、common の値型 ContactPoint と OpeningHours を使います。名前は英語です。"
    en: "One subtype (x-subclass-of) per dataset. The first subtypes are AEDLocation, PublicToilet and MedicalInstitution, with the common value types ContactPoint and OpeningHours. The names are English."
  - ja: "必須なのは id と type だけです。14 消防水利施設には名称の列が無く、11 観光施設は、事業者が公開するときは全国地方公共団体コードの代わりに法人番号を書きます。下位の型は親の必須項目を必須のままにするので、親で必須にすると、これらのデータセットの型が作れなくなります。AEDLocation、PublicToilet、MedicalInstitution は、EvacuationSite と同じく name、localGovernmentCode、externalFacilityId を必須にしています。"
    en: "Only id and type are required. Dataset 14 (fire water supplies) has no name column, and dataset 11 (tourist facilities) gives a corporate number instead of the local government code when a company publishes it. A subtype keeps its parent's required attributes, so requiring more here would rule out subtypes for these datasets. AEDLocation, PublicToilet and MedicalInstitution require name, localGovernmentCode and externalFacilityId, as EvacuationSite does."
  - ja: "01 公共施設と 11 観光施設に共通するアクセシビリティの列（車椅子、スロープ、点字、盲導犬、字幕、筆談、優先駐車場、オストメイト対応トイレ、授乳室など）は、基本の型に入れていません。8 つのうち 2 つのデータセットにしか無く、最初の下位の型はどれも使いません。GIF もこれを施設の拡張項目として、別のコアデータモデル「アクセシビリティ」に分けています。PublicFacility や TouristFacility を作るときに、値型として加えます（基本の型への属性の追加は互換性を壊しません）。"
    en: "The accessibility columns that datasets 01 (public facilities) and 11 (tourist facilities) share (wheelchair access and rental, ramps, braille, guide dogs, subtitles, written communication, priority parking, ostomate toilet, nursing room and more) are not in the base: only two of the eight datasets have them, none of the first subtypes uses them, and GIF too keeps them in a separate core data model, アクセシビリティ (accessibility), as an extended item of the facility. They come as a value type with PublicFacility or TouristFacility; adding an attribute to the base is backward compatible."
  - ja: "検討した上流（2026-10-11）：Smart Data Models の PointOfInterest（dataModel.PointOfInterest）は、施設の種類を国際的な分類のコード（category）で表し、住所は schema.org の PostalAddress です。日本の住所と、データセットごとの列を表せないので、型は使っていません。schema.org の Place、CivicStructure、PublicToilet、MedicalOrganization、Hospital は、意味は近いものの、カタログの型は自分のスキーマを持つ必要があるため、型としては定め直しています。属性では、contactPoint、openingHoursSpecification、url に schema.org の語を使っています。"
    en: "Upstream considered (2026-10-11): Smart Data Models PointOfInterest (dataModel.PointOfInterest) gives the kind of place as codes of an international classification (category) and the address as a schema.org PostalAddress; it cannot carry Japanese addresses or the per-dataset columns, so its type is not used. schema.org Place, CivicStructure, PublicToilet, MedicalOrganization and Hospital are close in meaning, but a catalog type needs its own schema, so the types are minted; schema.org terms are used for the attributes contactPoint, openingHoursSpecification and url."
  - ja: "属性の名前と IRI：name、nameKana、nameEn は EvacuationSite と同じ IRI です（nameKana と nameEn は disaster の名前空間）。同じ意味の語を二重に定めないためです。備考は remarks（facility の名前空間）にしました。01 と 11 は「説明」（description）と「備考」を別の列で持つので、NGSI-LD のコアの description は、後で「説明」に使えるように残しています（EvacuationSite は備考を description に入れています）。ID は、EvacuationSite の externalSiteId と同じ形の externalFacilityId です。schema.org の identifier は、どの識別子でも指せるので使っていません。"
    en: "Names and IRIs: name, nameKana and nameEn share EvacuationSite's IRIs (nameKana and nameEn in the disaster namespace) so that one meaning has one term. Remarks (備考) are remarks in the facility namespace: datasets 01 and 11 have a description column (説明) next to remarks, so the NGSI-LD core description is kept for that (EvacuationSite puts 備考 into description). The ID is externalFacilityId, shaped like EvacuationSite's externalSiteId; schema.org identifier was not used because it can be any identifier."
  - ja: "入れていないもの：地方公共団体名（コードから分かる）、高度の種別と高度の値（階数、標高、地表高のどれか）、画像と画像のライセンス。EvacuationSite と同じく、必要とするシステムが出てくるまで入れません。"
    en: "Left out: 地方公共団体名 (follows from the code), 高度の種別 and 高度の値 (a floor, an elevation or a height above ground), pictures and their licences, as for EvacuationSite, until a system needs them."
history:
  - ja: "2026-10-11（#104）：Issue の提案どおりに追加しました。メンテナー（@dkastl）が、グループでの話し合いをせずに、Issue の提案をそのまま決定としました。新しい分野 facility、最初の範囲、データセットごとの下位の型、英語の名前です。"
    en: "2026-10-11 (#104): added as proposed in the issue. The maintainer (@dkastl) took the issue's suggestions as decisions, without a group discussion: a new subject facility, the first scope, one subtype per dataset, and English names."
