notes:
  - ja: "国土交通省の「空き家データベースシステム標準仕様書」第 1.0 版（2025 年 4 月）の別紙 7 のうち、D0035「不動産情報プラットフォーム・バンク登録情報」と、D0003 の希望売買価格・希望賃貸価格の項目に基づいています（https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_fr3_000061.html 、2026-11-26 に確認）。項目ごとの対応は mapping/mlit-akiya-db.yaml にあります。"
    en: "Built on MLIT's 空き家データベースシステム標準仕様書, version 1.0 (April 2025), appendix 7: D0035 不動産情報プラットフォーム・バンク登録情報 (akiya bank registration) and the asking sale and rent prices of D0003 (https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_fr3_000061.html, checked 2026-11-26). Item by item in mapping/mlit-akiya-db.yaml."
  - ja: "仕様書では、1 件の空き家に登録が 10 件まで（①〜⑩）並びます。このモデルでは、登録 1 件を 1 エンティティにし、vacantHouse で台帳の空き家を指します。仕様書は希望価格を土地と建物に分けていますが、空き家バンクは合計で載せるので、salePrice と monthlyRent は合計にしています。名前、説明、URL、offerType は仕様書に無く、空き家バンクで物件を見せるために足しています。"
    en: "In the specification one vacant house carries up to ten registrations (① to ⑩). Here each registration is one entity, and vacantHouse points at the house in the register. The specification splits asking prices into land and building; akiya banks show the total, so salePrice and monthlyRent are totals. name, description, url and offerType are not in the specification; they are added to show the property on an akiya bank."
  - ja: "所有者の情報は入れません。空き家バンクへの登録と所有者情報の提供に対する本人の同意（D0035 の同意フラグ）は、登録の前提であり、物件のデータには入れません。所在地と位置は、公開する範囲にとどめます（町字まで、位置は丸める、など）。"
    en: "No owner data. The owner's consent to the listing and to sharing owner information (the consent flags of D0035) is a precondition of the listing, not part of the property data. Address and location stay at what the municipality publishes (down to the town, a rounded point, for example)."
  - ja: "全国版空き家・空き地バンク（国土交通省が選んだ事業者が運営）と、市区町村ごとの空き家バンクは、載せる項目がそれぞれ違い、公開された共通の形式がありません。このモデルは、仕様書の項目を共通部分にして、間取りや設備などは拡張で足せるようにしています。"
    en: "The national akiya and vacant land bank (run by operators MLIT selected) and the municipalities' own akiya banks each show different items, and there is no published common format. This model makes the specification's items the common part; floor plans, equipment and the like can be added as extensions."
  - ja: "検討した上流（2026-11-26）：schema.org の RealEstateListing と Offer は、不動産広告の型で、空き家バンクの登録番号、取引の状態、自治体との関係がありません。url は schema.org の属性を使っています。Smart Data Models には、不動産の物件情報の型がありません。"
    en: "Upstream considered (2026-11-26): schema.org RealEstateListing and Offer are made for property advertising and lack the akiya bank number, the deal state and the link to the municipality; url is used from schema.org. Smart Data Models has no real estate listing type."
