notes:
  - ja: "国土交通省の「空き家データベースシステム標準仕様書（業務要件・機能要件・非機能要件）」第 1.0 版（2025 年 4 月）の別紙 7「データ項目一覧」と、そのコード一覧（https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_fr3_000061.html 、2026-11-26 に確認）に基づいています。この仕様書は、国・地方デジタル共通基盤の共通 SaaS として市区町村に提供する空き家データベースの標準です。項目ごとの対応は mapping/mlit-akiya-db.yaml にあります。"
    en: "Built on MLIT's 空き家データベースシステム標準仕様書 (standard specification of the vacant house database system), version 1.0 (April 2025), appendix 7 データ項目一覧 (data items) and its code lists (https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_fr3_000061.html, checked 2026-11-26). The specification is the standard for the vacant house database that municipalities get as a shared SaaS under the national and local digital common platform. Item by item in mapping/mlit-akiya-db.yaml."
  - ja: "仕様書のエンティティのうち、物件そのものを表すもの（D0001 所在地、D0036 室・区画、D0002 所属地域、D0037 分類、D0003 詳細、D0008 評価・分類）から、全国で共通に使う項目を選んでいます。コード値は英語の値にし、説明に元のコードを書いています。"
    en: "Of the specification's entities, this model takes the commonly used items of those that describe the property itself (D0001 location, D0036 room or unit, D0002 area, D0037 classification, D0003 details, D0008 assessment). Code values are English tokens; each description gives the original code."
  - ja: "入れていないもの：所有者・共有者、関係者、相続人と、それらの外部連携の項目（D0016〜D0034、D0039、D0040）。住民基本台帳、戸籍、税の情報を含む個人情報で、共有するデータモデルに載せるものではありません。措置、通報、現地調査、補助、除却の履歴（D0009〜D0013、D0038）、対応のステータス（D0014）は、別の型として後で提案します。路線価、固定資産税評価額、屋根、都市計画のコードなども、今は入れていません。"
    en: "Left out: owners and co-owners, other related persons, heirs and their links to other systems (D0016 to D0034, D0039, D0040). They are personal data from resident, family and tax registers and do not belong in a shared data model. The histories of measures, reports, field surveys, subsidies and demolition (D0009 to D0013, D0038) and the case status (D0014) are left for separate types, to be proposed later. Road prices, tax assessments, roof and city planning codes are also left out for now."
  - ja: "台帳全体を公開するためのモデルではありません。管理不全空家等や特定空家等の区分、所在地、登記の番号は、個人の財産についての情報です。どの属性を公開するかは、市区町村が決めます。空き家バンクに公開する物件には VacantHouseListing を使います。"
    en: "The model is not meant for publishing the register as a whole. The category (poorly managed, specified), the address and the registry numbers are information about someone's property. The municipality decides which attributes it publishes. For properties published on an akiya bank, use VacantHouseListing."
  - ja: "検討した上流（2026-11-26）：Smart Data Models の Building（dataModel.Building）は、建物の一般的な型で、空き家の区分、空家法の認定、老朽度、接道がありません。floorsAboveGround と floorsBelowGround は Building の属性をそのまま使っています。schema.org の House、Accommodation は不動産の広告向けで、自治体の台帳の項目がありません。Smart Data Models と schema.org には、空き家や空室の状態を表す型がありません。"
    en: "Upstream considered (2026-11-26): Smart Data Models Building (dataModel.Building) is a general building type without the vacancy category, the designations under the Act, the deterioration grade or the road frontage; floorsAboveGround and floorsBelowGround are used from it as they are. schema.org House and Accommodation are made for property advertising and lack the register's items. Neither Smart Data Models nor schema.org has a type for a vacant house or vacancy."
