notes:
  - ja: "来歴の部分は、W3C の PROV-O（https://www.w3.org/TR/prov-o/ 、W3C 勧告 2013）に基づいています。判定は prov:Activity です。refersTo は prov:used、decidedAt は prov:endedAtTime、wasInformedBy は prov:wasInformedBy にあたります。答えたモデルは prov:SoftwareAgent、規則の集まりとその版は prov:Plan にあたりますが、NGSI-LD で扱いやすいように、model、profile、profileVersion は値（ID）で持ちます。正式な PROV-O にするには、モデルと規則の版に IRI を与え、prov:qualifiedAssociation（prov:agent と prov:hadPlan）を足します。人による確認は PROV-O では別の活動ですが、使う側を単純にするため、同じエンティティに持ちます。"
    en: "The provenance part rests on W3C PROV-O (https://www.w3.org/TR/prov-o/, W3C Recommendation 2013). A decision is a prov:Activity: refersTo is prov:used, decidedAt prov:endedAtTime, wasInformedBy prov:wasInformedBy. The model that answered is a prov:SoftwareAgent and the rule set version a prov:Plan; model, profile and profileVersion are plain values (ids) so they are easy to use in NGSI-LD. Full PROV-O would mint IRIs for models and rule set versions and add a prov:qualifiedAssociation (prov:agent, prov:hadPlan). The check by a person is a separate activity in PROV-O; it is kept on the same entity to keep consumers simple."
  - ja: "W3C と OGC の SOSA/SSN（https://www.w3.org/TR/vocab-ssn/ ）は PROV-O との対応を公開していて、同じ形になります：sosa:hasFeatureOfInterest ⊑ prov:used（refersTo）、sosa:madeBySensor ⊑ prov:wasAssociatedWith（model）、sosa:usedProcedure（profile）、sosa:resultTime ⊑ prov:endedAtTime（2017 年版。2023 年版の草案では sosa:endTime）。ただし、型としては使いません。1 つの観測は 1 つの結果しか持たず、問いを「観測できる性質」とみなすのは無理があるからです。"
    en: "W3C/OGC SOSA/SSN (https://www.w3.org/TR/vocab-ssn/) publishes its own alignment to PROV-O with the same shape: sosa:hasFeatureOfInterest ⊑ prov:used (refersTo), sosa:madeBySensor ⊑ prov:wasAssociatedWith (model), sosa:usedProcedure (profile), sosa:resultTime ⊑ prov:endedAtTime (2017; sosa:endTime in the 2023 draft). Not used as the type: one observation has one result, and a question is not really an observable property."
  - ja: "humanInvolvement の値は、W3C DPV 2.3（https://w3c-cg.github.io/dpv/2.3/dpv/ 、W3C コミュニティグループの報告書）の語です。DPV は処理の種類を表す語彙で、判定 1 件の記録は持たないので、人の関わり方の語だけを借りました。"
    en: "The values of humanInvolvement are W3C DPV 2.3 terms (https://w3c-cg.github.io/dpv/2.3/dpv/, W3C Community Group report). DPV describes kinds of processing, not single decision records, so only its human-involvement terms are borrowed."
  - ja: "検討した上流（2026-10-07）：Smart Data Models の SMAnalysis（SocialMedia。1 件の分析に 1 つの値と 1 つの確信度）が最も近いのですが、複数の答えも人の確認もありません。MLModel と MLProcessing（モデルとジョブの記述）、Alert、Anomaly、AIPrediction、DataQualityAssessment、schema.org の AssessAction と ChooseAction、ML Schema、FAIR4ML、AIRO と VAIR、DMN は、型として合いません。ETSI ISG CIM に、AI の結果のモデルはありません。確率の標準（DQV、ISO 19156 の結果の品質、UncertML、QUDT）は選択肢ごとの確率に合わないので、probability と probabilities は独自の項目にしました。"
    en: "Upstream considered (2026-10-07). Smart Data Models SMAnalysis (SocialMedia: one analysis with one value and one confidence) is the closest, but has no multiple answers and no review. MLModel and MLProcessing (descriptions of models and jobs), Alert, Anomaly, AIPrediction, DataQualityAssessment, schema.org AssessAction and ChooseAction, ML Schema, FAIR4ML, AIRO, VAIR and DMN do not fit as the type. ETSI ISG CIM has no model for AI results. The probability standards checked (DQV, ISO 19156 result quality, UncertML, QUDT) do not fit a probability per option, so probability and probabilities are our own."
  - ja: "法令や指針（2026-10-07 に確認）は、記録の形式を定めていません。ただし、policyRule（判定の根拠）は、AI 事業者ガイドライン第 1.2 版の 6)① と、デジタル庁 DS-920 の 6.5 がログに求める項目です。humanInvolvement は人の関わり方を記録する項目で、GDPR 第 22 条(3)・第 13〜15 条、EU の AI 法の第 26 条(11)・第 86 条、AI 事業者ガイドラインの U-7 が求める対応に役立ちます。保存期間はモデルの項目ではなく、運用の設定です。"
    en: "Laws and guidelines (checked 2026-10-07) define no record format. policyRule (the reason for the result) is there because AI事業者ガイドライン 第1.2版 6)① and the Digital Agency's DS-920 6.5 ask for it in logs; humanInvolvement records how a person takes part; it is useful for the duties in GDPR Art. 22(3) and 13–15, the EU AI Act Art. 26(11) and 86, and the guideline's U-7. Retention is a deployment setting, not a model attribute."
  - ja: "answers と corrections は NGSI-LD 1.8 の JsonProperty（中のキーは JSON-LD として展開しない）、humanInvolvement は VocabProperty（値は IRI）です。Orion-LD（post-1.12.0、2026-09-25 時点）はこの 2 つの型を受け付けないので、Orion-LD にはこのモデルのエンティティを保存できません。Scorpio 6.0.2、Stellio 2.38.0、GeonicDB には保存できます（2026-10-07 に確認）。入力のコピーは持ちません。入力に個人情報が入りうるため、refersTo で入力を指します。"
    en: "answers and corrections are NGSI-LD 1.8 JsonProperties (their keys are not expanded as JSON-LD), humanInvolvement a VocabProperty (its value is an IRI). Orion-LD (post-1.12.0, as of 2026-09-25) refuses both types, so it cannot store entities of this model; Scorpio 6.0.2, Stellio 2.38.0 and GeonicDB can (checked 2026-10-07). No copy of the input: it can hold personal data, so refersTo points to it."
  - ja: "facts は、規則の集まりが求めた空間の事実を、判定のために調べた結果です。値そのものを残すため、JsonProperty にしました。PROV-O では判定の入力にあたりますが、JsonProperty なので prov:used の関係にはなりません（prov:used は refersTo だけです）。正式な PROV-O にするには、事実ごとにエンティティを作り、prov:used で結びます。source は層とその日付などの ID で、IRI ではありません。位置そのものは持ちません（refersTo の先にあります）。facts は規則だけが使い、モデルには見せません。言語モデルは、事実があるだけで危険度を高めに答える傾向があったからです。"
    en: "facts are the spatial facts the rule set asks for, as looked up for the decision; a JsonProperty keeps the values themselves. In PROV-O they are inputs of the decision, but as a JsonProperty they make no prov:used link (only refersTo does); full PROV-O would make an entity per fact and link it with prov:used. source is an id such as a layer and its date, not an IRI. The location itself is not stored (it is on the refersTo entity). Only the rules use the facts; the model does not see them (in tests, language models rated danger higher whenever facts were present)."
  - ja: "下書き（draft）です。サブジェクト名 decision と名前空間 https://datamodels.jp/ns/decision/ は、新しいサブジェクトとしてグループが決めます。実データは、NGSI-LD ブローカー（GeonicDB）上の道路規制の報告に対する判定で作っています。"
    en: "Draft. The subject name decision and the namespace https://datamodels.jp/ns/decision/ are for the group to decide, as a new subject. Real data: decisions on road restriction reports in an NGSI-LD broker (GeonicDB)."
