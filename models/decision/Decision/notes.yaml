notes:
  - ja: "来歴の部分は、W3C の PROV-O（https://www.w3.org/TR/prov-o/ 、W3C 勧告 2013）に基づいています。判定は prov:Activity です。refersTo は prov:used、decidedAt は prov:endedAtTime、wasInformedBy は prov:wasInformedBy にあたります。答えたモデルは prov:SoftwareAgent、規則の集まりとその版は prov:Plan にあたりますが、NGSI-LD で扱いやすいように、model、profile、profileVersion は値（ID）で持ちます。正式な PROV-O にするには、モデルと規則の版に IRI を与え、prov:qualifiedAssociation（prov:agent と prov:hadPlan）を足します。人による確認は PROV-O では別の活動ですが、使う側を単純にするため、同じエンティティに持ちます。"
    en: "The provenance part rests on W3C PROV-O (https://www.w3.org/TR/prov-o/, W3C Recommendation 2013). A decision is a prov:Activity: refersTo is prov:used, decidedAt prov:endedAtTime, wasInformedBy prov:wasInformedBy. The model that answered is a prov:SoftwareAgent and the rule set version a prov:Plan; model, profile and profileVersion are plain values (ids) so they are easy to use in NGSI-LD. Full PROV-O would mint IRIs for models and rule set versions and add a prov:qualifiedAssociation (prov:agent, prov:hadPlan). The check by a person is a separate activity in PROV-O; it is kept on the same entity to keep consumers simple."
  - ja: "W3C と OGC の SOSA/SSN（https://www.w3.org/TR/vocab-ssn/ ）は PROV-O との対応を公開していて、同じ形になります：sosa:hasFeatureOfInterest ⊑ prov:used（refersTo）、sosa:madeBySensor ⊑ prov:wasAssociatedWith（model）、sosa:usedProcedure（profile）、sosa:resultTime ⊑ prov:endedAtTime（2017 年版。2023 年版の草案では sosa:endTime）。ただし、型としては使いません。1 つの観測は 1 つの結果しか持たず、問いを「観測できる性質」とみなすのは無理があるからです。"
    en: "W3C/OGC SOSA/SSN (https://www.w3.org/TR/vocab-ssn/) publishes its own alignment to PROV-O with the same shape: sosa:hasFeatureOfInterest ⊑ prov:used (refersTo), sosa:madeBySensor ⊑ prov:wasAssociatedWith (model), sosa:usedProcedure (profile), sosa:resultTime ⊑ prov:endedAtTime (2017; sosa:endTime in the 2023 draft). Not used as the type: one observation has one result, and a question is not really an observable property."
  - ja: "humanInvolvement の値は、W3C DPV 2.3（https://w3c-cg.github.io/dpv/2.3/dpv/ 、W3C コミュニティグループの報告書）の語です。DPV は処理の種類を表す語彙で、判定 1 件の記録は持たないので、人の関わり方の語だけを借りました。"
    en: "The values of humanInvolvement are W3C DPV 2.3 terms (https://w3c-cg.github.io/dpv/2.3/dpv/, W3C Community Group report). DPV describes kinds of processing, not single decision records, so only its human-involvement terms are borrowed."
  - ja: "検討した上流（2026-10-07）：Smart Data Models の SMAnalysis（SocialMedia。1 件の分析に 1 つの値と 1 つの確信度）が最も近いのですが、複数の答えも人の確認もありません。MLModel と MLProcessing（モデルとジョブの記述）、Alert、Anomaly、AIPrediction、DataQualityAssessment、schema.org の AssessAction と ChooseAction、ML Schema、FAIR4ML、AIRO と VAIR は、型として合いません。DMN も、記録の型としては合いません。判定とその論理を定めるもので、1 回の評価の記録は定めないからです。ただし、判定の連鎖は DMN の判定要件グラフに合わせています（DMN の注を参照）。ETSI ISG CIM に、AI の結果のモデルはありません。確率の標準（DQV、ISO 19156 の結果の品質、UncertML、QUDT）は選択肢ごとの確率に合わないので、probability と probabilities は独自の項目にしました。"
    en: "Upstream considered (2026-10-07). Smart Data Models SMAnalysis (SocialMedia: one analysis with one value and one confidence) is the closest, but has no multiple answers and no review. MLModel and MLProcessing (descriptions of models and jobs), Alert, Anomaly, AIPrediction, DataQualityAssessment, schema.org AssessAction and ChooseAction, ML Schema, FAIR4ML, AIRO and VAIR do not fit as the type. DMN does not fit as the record type either: it defines decisions and their logic, not the record of one evaluation. Chains of decisions, however, follow its decision requirements graph (see the note on DMN). ETSI ISG CIM has no model for AI results. The probability standards checked (DQV, ISO 19156 result quality, UncertML, QUDT) do not fit a probability per option, so probability and probabilities are our own."
  - ja: "法令や指針（2026-10-07 に確認）は、記録の形式を定めていません。ただし、policyRule（判定の根拠）は、AI 事業者ガイドライン第 1.2 版の 6)① と、デジタル庁 DS-920 の 6.5 がログに求める項目です。humanInvolvement は人の関わり方を記録する項目で、GDPR 第 22 条(3)・第 13〜15 条、EU の AI 法の第 26 条(11)・第 86 条、AI 事業者ガイドラインの U-7 が求める対応に役立ちます。保存期間はモデルの項目ではなく、運用の設定です。"
    en: "Laws and guidelines (checked 2026-10-07) define no record format. policyRule (the reason for the result) is there because AI事業者ガイドライン 第1.2版 6)① and the Digital Agency's DS-920 6.5 ask for it in logs; humanInvolvement records how a person takes part; it is useful for the duties in GDPR Art. 22(3) and 13–15, the EU AI Act Art. 26(11) and 86, and the guideline's U-7. Retention is a deployment setting, not a model attribute."
  - ja: "answers と corrections は NGSI-LD 1.8 の JsonProperty（中のキーは JSON-LD として展開しない）、humanInvolvement は VocabProperty（値は IRI）です。Orion-LD（post-1.12.0、2026-09-25 時点）はこの 2 つの型を受け付けないので、Orion-LD にはこのモデルのエンティティを保存できません。Scorpio 6.0.2、Stellio 2.38.0、GeonicDB には保存できます（2026-10-07 に確認）。入力のコピーは持ちません。入力に個人情報が入りうるため、refersTo で入力を指します。"
    en: "answers and corrections are NGSI-LD 1.8 JsonProperties (their keys are not expanded as JSON-LD), humanInvolvement a VocabProperty (its value is an IRI). Orion-LD (post-1.12.0, as of 2026-09-25) refuses both types, so it cannot store entities of this model; Scorpio 6.0.2, Stellio 2.38.0 and GeonicDB can (checked 2026-10-07). No copy of the input: it can hold personal data, so refersTo points to it."
  - ja: "facts は、規則の集まりが求めた空間の事実を、判定のために調べた結果です。値そのものを残すため、JsonProperty にしました。PROV-O では判定の入力にあたりますが、JsonProperty なので prov:used の関係にはなりません（prov:used は refersTo だけです）。正式な PROV-O にするには、事実ごとにエンティティを作り、prov:used で結びます。source は層とその日付などの ID で、IRI ではありません。位置そのものは持ちません（refersTo の先にあります）。facts は規則だけが使い、モデルには見せません。言語モデルは、事実があるだけで危険度を高めに答える傾向があったからです。"
    en: "facts are the spatial facts the rule set asks for, as looked up for the decision; a JsonProperty keeps the values themselves. In PROV-O they are inputs of the decision, but as a JsonProperty they make no prov:used link (only refersTo does); full PROV-O would make an entity per fact and link it with prov:used. source is an id such as a layer and its date, not an IRI. The location itself is not stored (it is on the refersTo entity). Only the rules use the facts; the model does not see them (in tests, language models rated danger higher whenever facts were present)."
  - ja: "判定の連鎖：判定は、同じエンティティについての前の判定の結果を使えます（例：最初の確認と避難の確認をまとめる、最後の判定）。前の判定は wasInformedBy に並べます。normalized の形では、前の判定ごとに 1 つのインスタンスを持つ、複数の値の Relationship です。インスタンスは datasetId で区別します（Task の relatedTo、assignee と同じです）。NGSI-LD 1.8 の ListRelationship（1 つの属性に、順番のある対象のリストを持つ）は使いません。このカタログの検査とアダプターが扱う型は Property、Relationship、GeoProperty、JsonProperty、VocabProperty だけで、前の判定の順番にも意味がないからです。normalized の形で datasetId の無い Relationship を 1 つだけ持つ、これまでのデータもそのまま有効です。key-values の形では、Task の複数の値の属性と同じく、前の判定が 1 つでも常に配列です。前の判定と規則だけで決め、モデルを使わない判定では、model は none、answers は空のリストです。例：例の判定（規則の集まり road-restriction-check）を check、避難の確認を evacuation として使う最後の判定は、wasInformedBy に 2 つの判定の ID を持ち、requiredDecisions に [{\"name\": \"check\", \"decision\": 例の判定の ID}, {\"name\": \"evacuation\", \"decision\": 避難の確認の ID}] を持ちます。"
    en: "Chains of decisions. A decision can use the results of earlier decisions about the same entity (for example a final decision that combines a first check and an evacuation check). wasInformedBy lists them. In the normalized form it is a multi-valued Relationship, one instance per earlier decision, told apart by datasetId, like relatedTo and assignee on Task. The NGSI-LD 1.8 ListRelationship (one attribute with an ordered list of targets) is not used: the catalog's checks and adapters know only Property, Relationship, GeoProperty, JsonProperty and VocabProperty, and the order of the earlier decisions means nothing. Data written before, with one Relationship and no datasetId in the normalized form, stays valid. In the key-values form wasInformedBy is always an array, even with one decision, like the multi-valued attributes of Task. A decision made from earlier decisions by rules only, with no model, has model none and an empty answers list. For example, a final decision that uses the example decision (rule set road-restriction-check) as check and an evacuation check as evacuation has both ids in wasInformedBy, and requiredDecisions [{\"name\": \"check\", \"decision\": the example's id}, {\"name\": \"evacuation\", \"decision\": the evacuation check's id}]."
  - ja: "requiredDecisions は、前の判定のそれぞれを、どの役割で使ったかを表します。規則の集まりがその判定に付けた名前（例：check）と、判定の ID の組です。PROV-O では、prov:qualifiedCommunication（prov:activity と prov:hadRole を持つ prov:Communication）にあたります。名前と ID を組にして 1 つの属性に持つため、JsonProperty にしました。requiredDecisions の判定は、すべて wasInformedBy にも入れます。JSON Schema では 2 つの属性の値を比べられないので、このことはスキーマでは検査しません。"
    en: "requiredDecisions says which earlier decision played which part: the name the rule set gives it (for example check) and the decision's id. In PROV-O this is a prov:qualifiedCommunication (a prov:Communication with prov:activity and prov:hadRole). It is a JsonProperty, so that each name stays with its id in one attribute. Every decision in requiredDecisions must also be in wasInformedBy; JSON Schema cannot compare the values of two attributes, so the schema does not check this."
  - ja: "wasRevisionOf は、この判定が置き換える前の判定を指します。同じ規則の集まりで、同じエンティティについて、もう一度行った判定です（例：使った判定の 1 つを人が確認した後に、最後の判定をやり直したとき）。前の判定も残り、新しいほうが有効です。前の判定の確認がまだ pending だったときは、その reviewStatus を superseded にします。確認は要らなくなり、finalAction、reviewedBy、reviewedAt は持ちません。PROV-O の prov:wasRevisionOf はエンティティ（prov:Entity）どうしを結びますが、このモデルの判定は prov:Activity です。ここでは、判定の記録どうし（NGSI-LD のエンティティどうし）を結ぶ関係として使います。"
    en: "wasRevisionOf points to the decision this one replaces: a decision of the same rule set about the same entity, made again (for example a final decision, made again after a person checked one of the decisions it used). The earlier decision stays; the newer one counts. If the earlier decision's check was still pending, its reviewStatus becomes superseded: the check is no longer needed, and it has no finalAction, reviewedBy or reviewedAt. In PROV-O, prov:wasRevisionOf links entities (prov:Entity), while a decision here is a prov:Activity; here it links the two decision records, which are the NGSI-LD entities."
  - ja: "DMN（Decision Model and Notation、OMG。ツールが読むのは 1.3、最新は 1.6）は、判定の連鎖を判定要件グラフ（decision requirements graph）として表します。このモデルの判定 1 件は、DMN の decision を 1 回評価した結果にあたります。profile と profileVersion は decision の定義（規則の集まりとその版）に、wasInformedBy と requiredDecisions は informationRequirement とその requiredDecision にあたります。requiredDecisions には、規則の集まりが使う名前も入ります。DMN が定めるのはグラフと判定の論理で、1 回の評価の記録は定めていません。そのため、記録の形は独自です。規則の集まりは、DMN の判定の論理（FEEL、決定表）を使いません。どの判定が実行されたかの記録（トレース）は判定エンジンの API に置き、このモデルには入れません。トレースの項目名は、Apache KIE と Camunda に合わせています。"
    en: "DMN (Decision Model and Notation, OMG; tools read 1.3, the latest is 1.6) describes chains of decisions as a decision requirements graph. One Decision entity is one evaluation of one DMN decision: profile and profileVersion name the decision's definition (the rule set and its version), and wasInformedBy and requiredDecisions are its informationRequirement elements with their requiredDecision; requiredDecisions adds the name the rule set uses. DMN defines the graph and the decision logic, but no record of an evaluation, so the record stays our own. The rule sets do not use DMN decision logic (FEEL, decision tables). The trace of the decisions that ran belongs to the decision engine's API, not to this model; its field names follow Apache KIE and Camunda."
  - ja: "ドラフト（draft）です。分野の名前 decision と名前空間 https://datamodels.jp/ns/decision/ は、新しい分野としてグループが決めます。実データは、NGSI-LD ブローカー（GeonicDB）上の道路規制の報告に対する判定で作っています。"
    en: "Draft. The subject name decision and the namespace https://datamodels.jp/ns/decision/ are for the group to decide, as a new subject. Real data: decisions on road restriction reports in an NGSI-LD broker (GeonicDB)."
history:
  - ja: "2026-10-20（プレリリース中のため 1.0.0 をその場で修正）：判定の連鎖のために、wasInformedBy を複数の値の Relationship にし（key-values の形では常に配列）、requiredDecisions と wasRevisionOf を加えました。reviewStatus に superseded を加えました。規則だけで決めた判定のために、answers を空のリストにできるようにしました（model は none）。"
    en: "2026-10-20 (a pre-release correction of 1.0.0 in place): for chains of decisions, wasInformedBy became a multi-valued Relationship (always an array in the key-values form), and requiredDecisions and wasRevisionOf were added. reviewStatus gained superseded. answers may be an empty list, for a decision made by rules only (its model is none)."
