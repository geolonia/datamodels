name: decision
version: 1.0.0
title:
  ja: 判定
  en: Decision
# One line for the subject card on the model list.
summary:
  ja: AI などによる自動判定の記録
  en: "Records of automated decisions, for example by an AI"
description:
  ja: "自動判定（AI などのモデルによる判定）の記録です。判定の対象と、使った規則とその版、答えたモデルとその答え、結果の行動、人による確認を残します。来歴は W3C の PROV-O に基づいています。"
  en: "Records of automated decisions (made with an AI or other model): what was decided about, with which rules and version, by which model, the answers and the resulting action, and how a person checked it. Provenance is based on W3C PROV-O."
source: minted            # minted | profile | global
origin:
  note: Drafted from the decision records of a rule-and-model decision engine connected to an NGSI-LD broker (GeonicDB), and from a survey of existing standards (W3C PROV-O, SOSA/SSN, DPV, Smart Data Models).
