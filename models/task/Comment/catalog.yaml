title:
  ja: "コメント"
  en: "Comment"
description:
  ja: "タスクに付けられた記録・申し送り・返信。フィールドの変更履歴は含めない（履歴は Temporal API が持つ）。"
  en: "A note, handover or reply on a task. Field change history is not a comment; the temporal API keeps history."
status: draft
tags: [task-management, rfc8984]
attributes:
  task:
    ja: "対象のタスク"
    en: "The task this belongs to"
  author:
    ja: "作成者（人・組織・チームのエンティティ）"
    en: "Creator (a person, organisation or team entity)"
  text:
    ja: "本文"
    en: "The text"
  textFormat:
    ja: "本文の形式"
    en: "Format of the text"
  inReplyTo:
    ja: "返信先のコメント"
    en: "The comment this replies to"
  isPrivate:
    ja: "非公開なら true。既定は false"
    en: "true when private; default false"
  sentAt:
    ja: "送信・投稿日時"
    en: "When it was posted"
  source:
    ja: "元システムにおけるこのオブジェクトの URL"
    en: "URL of this object in the system of record"
  externalId:
    ja: "元システムにおける識別子"
    en: "Identifier in the system of record"
