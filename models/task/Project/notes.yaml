notes:
  - ja: "検討した上流（2026-09-18）：Smart Data Models の dataModel.IssueTracking（Open311 の service_requests・services、IUDX の IssueReporting）は、どちらも 1 つの国の自治体の手続きに沿った住民からの通報の記録で、タスクのモデルではない。dataModel.Transportation の CityWork と dataModel.PredictiveMaintenance は分野に固有である。RFC 8984（JSCalendar Task）が汎用の参照先で、ここで使う値域もそこから取っている。Issue #22 を参照。"
    en: "Upstream considered (2026-09-18): Smart Data Models dataModel.IssueTracking (Open311 service_requests/services; IUDX IssueReporting), both citizen-complaint records shaped by one country's municipal process, not task models; dataModel.Transportation CityWork and dataModel.PredictiveMaintenance, domain-specific. RFC 8984 (JSCalendar Task) is the universal reference and supplies the value spaces used here. See issue #22."
  - ja: 核は意図して小さくしている。システム固有のデータ（作業時間、ウォッチャー、カスタムフィールド、地図の回転など）は拡張に入れる。
    en: The core is deliberately small. System-specific data (time spent, watchers, custom fields, map rotation) belongs in extensions.
  - ja: status はコアコンテキストの予約語なので、projectStatus としている。
    en: status is a protected core-context term, hence projectStatus.
  - ja: "2026-10-09 の変更（チームの決定。プレリリース中のため 1.0.0 をその場で修正）：Task と Milestone の start と due にそろえて、start と end は日付（YYYY-MM-DD）でも日時でもよい。理由は Task の注記にある。normalized 形式では、日付は NGSI-LD の Date、日時は DateTime の値になる。"
    en: "Changed on 2026-10-09 (team decision; a pre-release correction of 1.0.0 in place): like start and due on Task and Milestone, start and end accept a date (YYYY-MM-DD) or a date-time; the reason is in the notes of Task. In the normalized form a date is an NGSI-LD Date value and a date-time a DateTime value."
