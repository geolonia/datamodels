title:
  ja: "プロジェクト"
  en: "Project"
description:
  ja: "タスクをまとめる単位。Redmine のプロジェクト、GitHub のリポジトリ、災害対応の 1 オペレーションなど。名前は用途によって変わっても（案件、イベント、リポジトリ）、共通の属性を持つ。"
  en: "A grouping of tasks: a Redmine project, a GitHub repository, one disaster-response operation. Called differently in different settings, with the same common attributes."
status: draft
tags: [task-management, gtt, rfc8984]
attributes:
  name:
    ja: "名称・件名"
    en: "Name or subject"
  description:
    ja: "説明"
    en: "Description"
  identifier:
    ja: "短い識別子（Redmine の識別子、GitHub の owner/repo）"
    en: "Short handle (Redmine identifier, GitHub owner/repo)"
  parent:
    ja: "親プロジェクト"
    en: "Parent project"
  projectStatus:
    ja: "状態。core context の status は予約語のため projectStatus"
    en: "State; status is protected in the core context, hence projectStatus"
  isPublic:
    ja: "公開プロジェクトなら true"
    en: "true when public"
  homepage:
    ja: "ホームページ"
    en: "Homepage"
  start:
    ja: "予定期間の開始"
    en: "Planned start"
  end:
    ja: "予定期間の終了"
    en: "Planned end"
  location:
    ja: "位置。点・線・面・それらの集合など任意の GeoJSON ジオメトリ"
    en: "Location as any GeoJSON geometry: point, line, polygon or a collection"
  keywords:
    ja: "キーワード・ラベル"
    en: "Keywords or labels"
  source:
    ja: "元システムにおけるこのオブジェクトの URL"
    en: "URL of this object in the system of record"
  externalId:
    ja: "元システムにおける識別子"
    en: "Identifier in the system of record"
  dateCreated:
    ja: "元システムでの作成日時（ブローカーの createdAt とは別）"
    en: "Creation time in the system of record (distinct from the broker attribute createdAt)"
  dateModified:
    ja: "元システムでの更新日時"
    en: "Last modification time in the system of record"
