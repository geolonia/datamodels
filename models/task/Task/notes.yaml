notes:
  - ja: "検討した上流（2026-09-18）：Smart Data Models の dataModel.IssueTracking（Open311 の service_requests・services、IUDX の IssueReporting）は、どちらも 1 つの国の自治体の手続きに沿った住民からの通報の記録で、タスクのモデルではない。dataModel.Transportation の CityWork と dataModel.PredictiveMaintenance は分野に固有である。RFC 8984（JSCalendar Task）が汎用の参照先で、ここで使う値域もそこから取っている。Issue #22 を参照。"
    en: "Upstream considered (2026-09-18): Smart Data Models dataModel.IssueTracking (Open311 service_requests/services; IUDX IssueReporting), both citizen-complaint records shaped by one country's municipal process, not task models; dataModel.Transportation CityWork and dataModel.PredictiveMaintenance, domain-specific. RFC 8984 (JSCalendar Task) is the universal reference and supplies the value spaces used here. See issue #22."
  - ja: 核は意図して小さくしている。システム固有のデータ（作業時間、マイルストーン、ウォッチャー、カスタムフィールド、地図の回転など）は拡張に入れる。
    en: The core is deliberately small. System-specific data (time spent, milestones, watchers, custom fields, map rotation) belongs in extensions.
  - ja: progress は RFC 8984 の値の集合をそのまま使う：needs-action、in-process、completed、failed、cancelled。statusLabel には元のシステム自身の状態名を、subtype にはトラッカー、課題の種類、分類を残す。
    en: "progress uses the RFC 8984 value set unchanged: needs-action, in-process, completed, failed, cancelled. statusLabel keeps the source system’s own status name; subtype its tracker, issue type or category."
  - ja: relatedTo と assignee は複数の値を持つ Relationship である（対象ごとに 1 つのインスタンスで、datasetId で区別する）。key-values 形式では、対象が 1 つでも常に配列になる。関係の種類（blocks、precedes、duplicates など）は核に入れていない。
    en: relatedTo and assignee are multi-valued Relationships (one instance per target, distinguished by datasetId). In the key-values form they are always arrays, even with a single target. The kind of a relation (blocks, precedes, duplicates) is not in the core.
  - ja: 元のシステムは、JSON-LD のエイリアスの context で自分たちの型名と属性名を保てる（Tips のガイドを参照）。その語彙で、自分たちの型をこれらのサブクラスとして宣言することもできる。
    en: A source system keeps its own type and attribute names through a JSON-LD alias context (see the Tips guide); its vocabulary can also declare its types subclasses of these.
  - ja: project は任意である。RFC 8984 には project が無く、カレンダーの ToDo や単独の作業指示が project を作り出さなければならないのはおかしい。課題が必ずプロジェクトに属するトラッカーは、自分たちのモデルで必須にできる。name と progress は必須である。
    en: "project is optional: RFC 8984 has no project, and a calendar to-do or a stand-alone work order should not have to invent one; trackers whose issues always belong to a project can require it in their own model. name and progress are required."
