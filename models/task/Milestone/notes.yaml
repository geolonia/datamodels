notes:
  - ja: "核は意図して小さくしています。システム固有のデータ（作業時間、ウォッチャー、カスタムフィールド、地図の回転など）は拡張に入れます。"
    en: The core is deliberately small. System-specific data (time spent, watchers, custom fields, map rotation) belongs in extensions.
  - ja: "status はコアコンテキストの予約語なので、milestoneStatus としています。locked は Redmine と同じ意味で、新しいタスクを加えられない状態です。GitHub と GitLab には open と closed しかありません。"
    en: status is a protected core-context term, hence milestoneStatus. locked means what it means in Redmine, no new tasks may be added; GitHub and GitLab have only open and closed.
  - ja: "タスクは、Task.milestone でマイルストーンを指します。1 つのタスクが指すマイルストーンは 1 つで、Redmine、GitHub、GitLab と同じです。Jira の修正バージョンは複数持てるので、2 つ目からは拡張で扱います。"
    en: A task points at its milestone through Task.milestone, one milestone per task as in Redmine, GitHub and GitLab (Jira allows several fix versions; further ones are left to extensions).
  - ja: "2026-10-09 の変更（チームの決定。プレリリース中のため 1.0.0 をその場で修正）：Comment と Attachment をこのサブジェクトから外し、Milestone を加えました。メモやファイルはタスクに固有のものではなく、どのエンティティにも付くからです。この 2 つは、Redmine のジャーナルと添付ファイル、そして 2026-09-24 に削除した高松市の災害対応モデルから来ていました。GTT 自体は、ジャーナルも添付ファイルも出力しません。アプリケーションが必要とするときは、schema.org の語（Comment、MediaObject）を再利用します。どのエンティティにも結べる形で、common サブジェクトに置きます。Milestone は、Redmine（バージョン）、GitHub と GitLab（マイルストーン）、Jira（修正バージョン）に共通するものです：名前、説明、期限、状態（受付中・完了）、プロジェクト。元の設計は Issue #22 にあります。"
    en: "Changed on 2026-10-09 (team decision; a pre-release correction of 1.0.0 in place): Comment and Attachment were removed from this subject and Milestone was added. Notes and files are not task concepts: they attach to any entity. The two came from Redmine journals and attachments and from the former Takamatsu disaster models, removed on 2026-09-24; GTT itself never emits journals or attachments. If an application needs them, they belong in the common subject, reusing schema.org (Comment, MediaObject) and linkable to any entity. Milestone is what Redmine (versions), GitHub and GitLab (milestones) and Jira (fix versions) share: a name, a description, a due date, open or closed, a project. The original design is in issue #22."
  - ja: "2026-10-09 の変更（チームの決定。プレリリース中のため 1.0.0 をその場で修正）：start と due は、日付（YYYY-MM-DD）でも日時でも構いません。Redmine（開始日、期日、バージョンの期日）、GitHub のマイルストーン（画面では日付）、GitLab、多くの自治体の作業指示は、日付しか持たないからです。日付を日時に直すと、元のデータに無い時刻を作ることになります。最初の実装（GTT の Redmine プラグイン）は、日付をそのまま出力します。RFC 8984 の start と due は時差を含まない日時（LocalDateTime）なので、この点は RFC 8984 と異なります。normalized 形式では、日付は NGSI-LD の Date、日時は DateTime の値になります。"
    en: "Changed on 2026-10-09 (team decision; a pre-release correction of 1.0.0 in place): start and due accept a date (YYYY-MM-DD) or a date-time. Redmine (start date, due date, version due date), GitHub milestones (a date in the UI), GitLab and many municipal work orders have only dates; turning a date into a date-time would invent a time of day that is not in the data. The first implementation, the GTT Redmine plugin, emits plain dates. This differs from RFC 8984, whose start and due are LocalDateTime values (a date and time without offset). In the normalized form a date is an NGSI-LD Date value and a date-time a DateTime value."
