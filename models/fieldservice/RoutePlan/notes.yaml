notes:
  - ja: "このモデルは、VROOM の出力（routes、steps、unassigned、summary）に基づいています。ルートの止まる所の種類（start、job、break、end）、着く時刻と出る時刻、距離、時間は VROOM と同じ意味です。時刻は日時、時間は ISO 8601 の期間、距離はメートルにしました。"
    en: "Built on the output of VROOM (routes, steps, unassigned, summary): the kinds of stops (start, job, break, end), arrival and departure, distance and duration mean what they mean there. Times are date-times, durations ISO 8601 durations, and distances metres."
  - ja: "ルート最適化の項目は、VROOM（https://github.com/VROOM-Project/vroom/blob/master/docs/API.md 、BSD-2-Clause）の入力と出力に合わせています。VROOM の形は、jsprit や OR-Tools など、ほかの VRP のソフトウェアの考え方（job、vehicle、time window、amount と capacity、skills、service time）と共通です。値の単位は、そのまま渡せる形にしました。時刻は日時（ISO 8601）で、VROOM が使う秒数への変換は使う側でします。"
    en: "The route optimisation fields follow the input and output of VROOM (https://github.com/VROOM-Project/vroom/blob/master/docs/API.md, BSD-2-Clause), whose concepts (job, vehicle, time window, amount and capacity, skills, service time) other VRP software such as jsprit and OR-Tools shares. Times are date-times (ISO 8601); converting them to the seconds VROOM uses is left to the client."
  - ja: "検討した上流（2026-11-17）：Smart Data Models の FleetVehicleOperation（dataModel.Transportation）は、車両 1 台の 1 回の運行の記録で、実際の開始と終了を持ちます。計画（まだ走っていないルートと、入らなかった依頼）は持たないので、型としては使いません。計画を走った記録は FleetVehicleOperation で表せます。GTFS の trip と stop_times（dataModel.UrbanMobility）は時刻表の決まった運行で、毎日変わる依頼の順番に合いません。"
    en: "Upstream considered (2026-11-17). Smart Data Models FleetVehicleOperation (dataModel.Transportation) records one run of one vehicle, with its actual start and end; it has no plan (routes not yet driven, requests that did not fit), so it is not used as the type. What was driven can be recorded with FleetVehicleOperation. GTFS trips and stop_times (dataModel.UrbanMobility) are fixed timetabled runs, not an order of requests that changes every day."
  - ja: "routes は 1 つの Property で、中の車両や依頼の ID は Relationship になりません。ブローカーで関係をたどるために、vehicles と serviceRequests を複数の値の Relationship として別に持ちます（key-values の形では常に配列、normalized の形ではインスタンスごとに datasetId）。ServiceRequest の routePlan は、反対向きの関係です。routes の止まる所の位置（position）は依頼の location と同じなので、routes にも x-personal-data を付けました。"
    en: "routes is one Property, so the vehicle and request ids inside it are not Relationships. To follow links in a broker, vehicles and serviceRequests are kept apart as multi-valued Relationships (always arrays in the key-values form, one instance per target with a datasetId in the normalized form). ServiceRequest's routePlan is the link the other way. The stop positions in routes repeat the requests' locations, so routes carries x-personal-data too."
  - ja: "グループで決めること：ServiceVehicle と同じく、今ある実データはデモで計算したルートだけです。"
    en: "For the group to decide: as with ServiceVehicle, the only real data so far is the routes a demo computes."
  - ja: "ドラフト（draft）です。分野の名前 fieldservice と名前空間 https://datamodels.jp/ns/fieldservice/ は、新しい分野としてグループが決めます。"
    en: "Draft. The subject name fieldservice and the namespace https://datamodels.jp/ns/fieldservice/ are for the group to decide, as a new subject."
