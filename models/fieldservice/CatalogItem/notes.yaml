notes:
  - ja: "このモデルは、自治体が公開する粗大ごみの品目と手数料の一覧（品目、区分、手数料、大きさの条件、出せないものとその出し方）に基づいています。例として、西宮市と芦屋市の一覧（約 450 品目）をこの形にし、NGSI-LD ブローカー（GeonicDB）で使っています。手数料の項目は schema.org の priceCurrency と validFrom、validThrough を使います。"
    en: "Built on the lists of bulky waste items and fees municipalities publish (item, section, fee, size condition, items not taken and where they go). The lists of Nishinomiya and Ashiya (about 450 items) are in this form in an NGSI-LD broker (GeonicDB). The fee fields use schema.org priceCurrency, validFrom and validThrough."
  - ja: "検討した上流（2026-11-17）：schema.org の Product、Offer、Service は売り物とその価格の語彙で、受けない品目（accepted が false）や、作業時間、量、技能を表せないため、型としては使いません。Smart Data Models の dataModel.WasteManagement には容器（WasteContainer）と観測しかなく、品目の一覧はありません。"
    en: "Upstream considered (2026-11-17). schema.org Product, Offer and Service describe things for sale and their prices; they cannot say an item is not taken (accepted false), nor give a service time, amount or skills, so they are not used as the type. Smart Data Models dataModel.WasteManagement has containers (WasteContainer) and observations, but no item lists."
  - ja: "label と note は NGSI-LD の LanguageProperty（言語ごとの文字列、languageMap）です。粗大ごみの一覧は、外国語の名前で探す住民もいるため、日本語と英語の名前を持つことがあります。このカタログで LanguageProperty を使うのは、この分野が初めてです（datamodels-toolkit 0.4.2 から）。key-values の形では {\"languageMap\": {...}} のまま残ります。"
    en: "label and note are NGSI-LD LanguageProperties (a string per language, languageMap): residents search bulky waste lists in other languages too, so a list may carry Japanese and English names. This subject is the first in the catalog with a LanguageProperty (datamodels-toolkit 0.4.2 and later). In the key-values form the value stays {\"languageMap\": {...}}."
  - ja: "name と description を使わない理由（2026-11-23 決定、#326）：name と description は NGSI-LD のコアの用語で、ほかの分野（Facility、Task など 4 分野の 9 モデル）では Property です。同じ名前を LanguageProperty にすると、GeonicDB は、1 つのテナントに登録したモデルの間で同じ名前の属性の型が違うため、登録を断ります。そこで、言語ごとの呼び名は label（IRI は rdfs:label）、説明は note にしました。この分野の Crew と ServiceVehicle も、呼び名は label です。note の IRI を dcterms:description にしないのは、ほかの分野の description が展開されるのと同じ IRI だからです。NGSI-LD のブローカーは、属性を展開した IRI で見分けるので、名前を変えても型の衝突が残ります。"
    en: "Why not name and description (decided 2026-11-23, #326): name and description are core NGSI-LD terms and Properties in the other subjects (9 models in 4 subjects, Facility and Task among them). As LanguageProperties here, GeonicDB would refuse to register them next to those models in one tenant, since attributes of the same name would have different types. So the name per language is label (IRI rdfs:label) and the description is note. Crew and ServiceVehicle in this subject use label for their names too. note has an IRI of its own rather than dcterms:description, because that is the IRI the description of the other subjects expands to; NGSI-LD brokers tell attributes apart by their expanded IRI, so the type clash would remain under the new name."
  - ja: "例：千代田区の一覧（2026-04-01 更新）の「ソファー（2人以上用）、ソファーベッドなど 1,600 円」です。英語の名前、説明（note）、作業時間、量（容積の点数）、技能は、例のために足したもので、区の一覧にはありません。"
    en: "Example: the row \"ソファー（2人以上用）、ソファーベッドなど, 1,600 yen\" of Chiyoda's list (updated 2026-04-01). The English name, the note, the service time, the amount (a volume score) and the skills were added for the example; the ward's list does not have them."
  - ja: "ドラフト（draft）です。分野の名前 fieldservice と名前空間 https://datamodels.jp/ns/fieldservice/ は、2026-11-23 に決めました（#326）。"
    en: "Draft. The subject name fieldservice and the namespace https://datamodels.jp/ns/fieldservice/ were decided on 2026-11-23 (#326)."
