notes:
  - ja: "このモデルは、自治体が公開する粗大ごみの品目と手数料の一覧（品目、区分、手数料、大きさの条件、出せないものとその出し方）に基づいています。例として、西宮市と芦屋市の一覧（約 450 品目）をこの形にし、NGSI-LD ブローカー（GeonicDB）で使っています。手数料の項目は schema.org の priceCurrency と validFrom、validThrough を使います。"
    en: "Built on the lists of bulky waste items and fees municipalities publish (item, section, fee, size condition, items not taken and where they go). The lists of Nishinomiya and Ashiya (about 450 items) are in this form in an NGSI-LD broker (GeonicDB). The fee fields use schema.org priceCurrency, validFrom and validThrough."
  - ja: "検討した上流（2026-11-17）：schema.org の Product、Offer、Service は売り物とその価格の語彙で、受けない品目（accepted が false）や、作業時間、量、技能を表せないため、型としては使いません。Smart Data Models の dataModel.WasteManagement には容器（WasteContainer）と観測しかなく、品目の一覧はありません。"
    en: "Upstream considered (2026-11-17). schema.org Product, Offer and Service describe things for sale and their prices; they cannot say an item is not taken (accepted false), nor give a service time, amount or skills, so they are not used as the type. Smart Data Models dataModel.WasteManagement has containers (WasteContainer) and observations, but no item lists."
  - ja: "name と description は NGSI-LD の LanguageProperty（言語ごとの文字列、languageMap）です。粗大ごみの一覧は、外国語の名前で探す住民もいるため、日本語と英語の名前を持つことがあります。このカタログで LanguageProperty を使うのは、このモデルが初めてで、datamodels-toolkit の対応（geolonia/datamodels-toolkit#155）を待っています。key-values の形では {\"languageMap\": {...}} のまま残ります。"
    en: "name and description are NGSI-LD LanguageProperties (a string per language, languageMap): residents search bulky waste lists in other languages too, so a list may carry Japanese and English names. This is the first model in the catalog with a LanguageProperty; it needs the toolkit support in geolonia/datamodels-toolkit#155. In the key-values form the value stays {\"languageMap\": {...}}."
  - ja: "グループで決めること：name は NGSI-LD のコアの用語で、ほかの分野（Facility、Task など）では Property です。同じ IRI が分野によって Property と LanguageProperty になります。NGSI-LD では許されますが、GeonicDB は、1 つのテナントに登録したモデルの間で、同じ名前の属性の型が違うと、登録を断ります。別の名前（たとえば label）にするか、このままにするかを決めてください。"
    en: "For the group to decide: name is a core NGSI-LD term and a Property in the other subjects (Facility, Task and others), so the same IRI is a Property there and a LanguageProperty here. NGSI-LD allows this, but GeonicDB refuses to register models in one tenant whose attributes of the same name have different types. Either use another name (label, say) or keep it."
  - ja: "例：千代田区の一覧（2026-04-01 更新）の「ソファー（2人以上用）、ソファーベッドなど 1,600 円」です。英語の名前、作業時間、量、技能は、例のために足したもので、区の一覧にはありません。"
    en: "Example: the row \"ソファー（2人以上用）、ソファーベッドなど, 1,600 yen\" of Chiyoda's list (updated 2026-04-01). The English name, the service time, the amount and the skills were added for the example; the ward's list does not have them."
  - ja: "ドラフト（draft）です。分野の名前 fieldservice と名前空間 https://datamodels.jp/ns/fieldservice/ は、新しい分野としてグループが決めます。"
    en: "Draft. The subject name fieldservice and the namespace https://datamodels.jp/ns/fieldservice/ are for the group to decide, as a new subject."
