notes:
  - ja: "このモデルは Open311 GeoReport v2（http://wiki.open311.org/GeoReport_v2/ ）の service request に基づいています。serviceCode は service_code、localGovernmentCode は jurisdiction_id、requestedAt は requested_datetime にあたり、requestStatus の値は open と closed を細かく分けたものです。Open311 は通報を受けて記録するための形で、計画に使う項目（時間の幅、作業時間、量、技能）はありません。それらは VROOM の job に合わせて足しました。"
    en: "Built on Open311 GeoReport v2 (http://wiki.open311.org/GeoReport_v2/) service requests: serviceCode is service_code, localGovernmentCode jurisdiction_id, requestedAt requested_datetime, and the values of requestStatus split open and closed more finely. Open311 records reports and has nothing to plan with (time windows, service time, amounts, skills); those were added after the job of VROOM."
  - ja: "ルート最適化の項目は、VROOM（https://github.com/VROOM-Project/vroom/blob/master/docs/API.md 、BSD-2-Clause）の入力と出力に合わせています。VROOM の形は、jsprit や OR-Tools など、ほかの VRP のソフトウェアの考え方（job、vehicle、time window、amount と capacity、skills、service time）と共通です。値の単位は、そのまま渡せる形にしました。時刻は日時（ISO 8601）で、VROOM が使う秒数への変換は使う側でします。"
    en: "The route optimisation fields follow the input and output of VROOM (https://github.com/VROOM-Project/vroom/blob/master/docs/API.md, BSD-2-Clause), whose concepts (job, vehicle, time window, amount and capacity, skills, service time) other VRP software such as jsprit and OR-Tools shares. Times are date-times (ISO 8601); converting them to the seconds VROOM uses is left to the client."
  - ja: "検討した上流（2026-11-17）：Smart Data Models の IssueReporting（dataModel.IssueTracking、Open311 の写し）は、通報の記録で、計画に使う項目がないため使いません。Task（このカタログの task 分野）は追跡する作業 1 件で、依頼の中身（品目と数）、手数料、時間の幅を持たないため、サブクラスにはしませんでした。依頼から作った作業は refersTo で Task を指せます。schema.org の Order と ServiceChannel は、売り買いと窓口の語彙で、場所での作業の計画に合いません。"
    en: "Upstream considered (2026-11-17). Smart Data Models IssueReporting (dataModel.IssueTracking, a copy of Open311) records reports and has nothing to plan with, so it is not used. Task (this catalog's task subject) is one tracked unit of work without the lines, fee or time windows of a request, so ServiceRequest is not its subclass; refersTo points to the Task made from a request. schema.org Order and ServiceChannel are about selling and service channels, not planning work at a place."
  - ja: "個人情報：名前、住所、電話番号は持ちません。requester は別のエンティティを指し、見せる相手を分けられるようにします。description は依頼した人の言葉なので、個人を特定できることが書かれることがあります。そのため、requester と description に x-personal-data を付けました。location は品目を出す場所の点で、住所の代わりになりうるので、公開するときは町名の単位にぼかすことを勧めます。"
    en: "Personal data: no name, address or phone number. requester points to another entity, so access to it can be limited separately; description is in the requester's words and may identify them. Both carry x-personal-data. location is the point where the items are put out and can stand in for an address: when publishing, blur it to the town level."
  - ja: "例：2026 年 7 月の千代田区の大雨（このカタログの共通の場面）で、神田須田町の住民が、浸水したソファーの収集を頼んだ依頼です。品目と手数料（ソファー（2人以上用）1,600 円）は千代田区の公開している一覧（2026-04-01 更新）のとおりで、依頼、人、番号は架空です。"
    en: "Example: during the July 2026 heavy rain in Chiyoda (the catalog's shared scenario), a resident of Kanda-Sudachō asks for a flood-damaged sofa to be collected. The item and its fee (two-seat-or-more sofa, 1,600 yen) are as Chiyoda publishes them (updated 2026-04-01); the request, the person and the numbers are invented."
  - ja: "ドラフト（draft）です。分野の名前 fieldservice と名前空間 https://datamodels.jp/ns/fieldservice/ は、新しい分野としてグループが決めます。"
    en: "Draft. The subject name fieldservice and the namespace https://datamodels.jp/ns/fieldservice/ are for the group to decide, as a new subject."
