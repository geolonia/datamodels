notes:
  - ja: "エンティティの型ではなく、値型です。`contactPoint` Property（IRI https://schema.org/contactPoint ）の値として使い、エンティティのスキーマから $ref でこのスキーマを参照します。"
    en: A value type, not an entity type. Use it as the value of a `contactPoint` Property (IRI https://schema.org/contactPoint) and reference the schema with $ref from an entity schema.
  - ja: "デジタル庁の自治体標準オープンデータセット、データ項目定義書 A（2026-08-01、2026-10-11 に確認）の連絡先の列（電話番号、内線番号、FAX番号、連絡先メールアドレス、連絡先FormURL、連絡先備考（その他、SNSなど）、郵便番号）に基づいています。これらの列は 01 公共施設、05 子育て施設、08 AED、09 介護サービス事業所、10 医療機関、11 観光施設にあります（FAX番号は 05、09、10 だけ）。11 観光施設は、同じ列を「連絡先電話番号」「連絡先内線番号」という名前で持ち、「連絡先名称」も持ちます。対応は mapping/jichitai-opendata-contact.yaml にあります。"
    en: "Built on the contact columns of the Digital Agency's 自治体標準オープンデータセット, data item definition sheet A (2026-08-01, checked 2026-10-11): 電話番号, 内線番号, FAX番号, 連絡先メールアドレス, 連絡先FormURL, 連絡先備考（その他、SNSなど） and 郵便番号. Datasets 01 public facilities, 05 childcare facilities, 08 AEDs, 09 care service providers, 10 medical institutions and 11 tourist facilities have them (FAX番号 only 05, 09 and 10). Dataset 11 names two of them 連絡先電話番号 and 連絡先内線番号, and adds 連絡先名称. The correspondence is in mapping/jichitai-opendata-contact.yaml."
  - ja: "GIF のコアデータモデル「連絡先」（438_コアデータモデル_DMD.xlsx、2026-10-11 に確認）にも対応します。GIF は連絡先名称、用途、住所を持ち、FAX 番号と内線番号を電話番号に含めます。対応は mapping/gif-contact-point.yaml にあります。"
    en: "It also corresponds to GIF's core data model 連絡先 (438_コアデータモデル_DMD.xlsx, checked 2026-10-11). GIF has a name, a purpose and an address for the contact, and counts fax and extension numbers as telephone numbers. The correspondence is in mapping/gif-contact-point.yaml."
  - ja: "検討した上流（2026-10-11）：schema.org の ContactPoint の語は、意味が合うものを再利用しています（telephone、faxNumber、email、url、postalCode）。型そのものは、JapaneseAddress と同じく、自分のスキーマとページを持つカタログの値型として定め、schema.org の ContactPoint のサブクラスとしています（2026-10-12）。連絡先に郵便番号を持ち、内線番号とそのほかの連絡手段を足しているからです。Smart Data Models の PointOfInterest の contactPoint も、schema.org の ContactPoint と同じ形です。内線番号と、SNS などのそのほかの連絡手段にあたる語は schema.org に無いので、common の名前空間で定めました（telephoneExtension、otherChannels）。"
    en: "Upstream considered (2026-10-11): schema.org ContactPoint terms are reused where the meaning matches (telephone, faxNumber, email, url, postalCode). The type itself is minted as a catalog value type with its own schema and page, like JapaneseAddress, and declared a subclass of schema.org ContactPoint (2026-10-12), because it adds terms: the postal code on the contact, the extension and other channels. Smart Data Models PointOfInterest's contactPoint has the same schema.org shape. schema.org has no term for an extension or for other channels such as social media, so these are minted in the common namespace (telephoneExtension, otherChannels)."
  - ja: "入れていないもの：連絡先の名称（11 観光施設の「連絡先名称」、GIF の連絡先名称）、GIF の用途と住所。最初のモデル（AEDLocation、PublicToilet、MedicalInstitution）のデータセットに無いからです。必要になったら追加します。"
    en: "Left out: the name of the contact (連絡先名称 in dataset 11 and in GIF), and GIF's purpose and address of the contact. The datasets of the first models (AEDLocation, PublicToilet, MedicalInstitution) do not have them; they can be added when needed."
