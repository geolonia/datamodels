notes:
  - ja: "エンティティの型ではなく、値型です。`openingHoursSpecification` Property（IRI https://schema.org/openingHoursSpecification ）の値として使い、エンティティのスキーマから $ref でこのスキーマを参照します。"
    en: A value type, not an entity type. Use it as the value of an `openingHoursSpecification` Property (IRI https://schema.org/openingHoursSpecification) and reference the schema with $ref from an entity schema.
  - ja: "デジタル庁の自治体標準オープンデータセット、データ項目定義書 A（2026-08-01、2026-10-11 に確認）の利用時間の列に基づいています。列の名前はデータセットごとに違います。08 AED は「利用可能曜日」「開始時間」「終了時間」「利用可能日時特記事項」、10 医療機関は「診療曜日」「診療開始時間」「診療終了時間」「診療日時特記事項」、13 公衆トイレは曜日の列が無く「利用開始時間」「利用終了時間」「利用可能時間特記事項」です。そのため、対応表はデータセットごとに分けています（mapping/jichitai-opendata-hours.yaml、jichitai-opendata-medical-hours.yaml、jichitai-opendata-toilet-hours.yaml）。"
    en: "Built on the hours columns of the Digital Agency's 自治体標準オープンデータセット, data item definition sheet A (2026-08-01, checked 2026-10-11). Their names differ per dataset: 08 AEDs has 利用可能曜日, 開始時間, 終了時間 and 利用可能日時特記事項; 10 medical institutions 診療曜日, 診療開始時間, 診療終了時間 and 診療日時特記事項; 13 public toilets has no weekday column, and 利用開始時間, 利用終了時間 and 利用可能時間特記事項. So there is one mapping per dataset (mapping/jichitai-opendata-hours.yaml, jichitai-opendata-medical-hours.yaml, jichitai-opendata-toilet-hours.yaml)."
  - ja: "曜日と時刻の表記は、データセットの共通ルールのとおり、GIF のコアデータパーツ「日付時刻」（441_コアデータパーツ_日付時刻.docx、2026-10-11 に確認）に従います。曜日は月火水木金または 12345、時刻は HH:MM:SS（秒は省略できる）です。GIF には祝日の表記がありません。祝日の扱いは特記事項に文章で書かれます。"
    en: "As the datasets' common rules say, weekdays and times follow GIF's core data part 日付時刻 (441_コアデータパーツ_日付時刻.docx, checked 2026-10-11): weekdays as 月火水木金 or 12345, times as HH:MM:SS with optional seconds. GIF has no notation for public holidays; the datasets describe them in the remarks column."
  - ja: "検討した上流（2026-10-11）：schema.org の OpeningHoursSpecification の語（dayOfWeek、opens、closes）を再利用しています。曜日の値は schema.org の DayOfWeek の名前です。GIF のコアデータモデル「施設」の拡張項目（利用可能曜日、開始時刻、終了時刻、利用可能日時説明）も同じ情報を持ちます。対応は mapping/gif-facility-hours.yaml にあります。型そのものは、カタログの値型として定め、schema.org の OpeningHoursSpecification のサブクラスとしています（2026-10-12）。validFrom と validThrough の代わりに、文章で書く特記事項（description、Dublin Core の語）を足しているからです。schema.org の openingHours（\"Mo-Fr 09:00-17:00\" のような 1 つの文字列）は、構造が違うので使っていません。"
    en: "Upstream considered (2026-10-11): schema.org OpeningHoursSpecification terms are reused (dayOfWeek, opens, closes), with schema.org DayOfWeek names as the weekday values. The extended items of GIF's core data model 施設 (利用可能曜日, 開始時刻, 終了時刻, 利用可能日時説明) carry the same information; see mapping/gif-facility-hours.yaml. The type itself is minted as a catalog value type and declared a subclass of schema.org OpeningHoursSpecification (2026-10-12), because it adds remarks in free text (description, a Dublin Core term) instead of validFrom and validThrough. schema.org openingHours (a single string such as \"Mo-Fr 09:00-17:00\") is not used: its structure differs."
  - ja: "1 つの値は、データセットの 1 行と同じく、1 つの決まった時間です。曜日によって時間が違う施設は、いまは特記事項に書きます。複数の時間を持たせるかどうかは、実データで必要になってから決めます。変換ツール（datamodels convert）は、いまは開始時刻、終了時刻、特記事項だけを読みます。曜日の表記（月火水木金）を配列にする変換は、まだありません。"
    en: "One value is one regular schedule, as one row of the datasets has. A facility whose hours differ by weekday writes that in the remarks for now; whether to allow several schedules is decided when real data needs it. The converter (datamodels convert) currently reads the opening time, the closing time and the remarks; it has no transform yet that turns the weekday notation (月火水木金) into the array."
  - ja: "実データ（中央区「AED設置箇所一覧」、2026-10-11 に確認、256 行）では、時刻が「0:00」のように時の 0 を省いて書かれていることがあります。GIF の表記は 2 桁なので、このスキーマは受け付けず、変換ツールはその行を無効にします（5 行）。開始と終了がどちらも 0:00 の行は、24 時間のことと思われますが、定義書には書かれていません。"
    en: "Real data seen (Chuo City's AED設置箇所一覧, checked 2026-10-11, 256 rows): times can be written without the leading zero of the hour (0:00). GIF writes two digits, so this schema rejects them and the converter rejects those rows (5). Rows whose start and end are both 0:00 probably mean 24 hours; the definition sheet does not say."
