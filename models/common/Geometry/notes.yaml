notes:
  - ja: "エンティティの型ではなく、値型です。コアの location GeoProperty（またはほかの GeoProperty）の値として使い、エンティティのスキーマから $ref でこのスキーマを参照します。メンバーの名前（type、coordinates、bbox）とジオメトリの型（Point、Polygon など）は NGSI-LD のコアコンテキストの語で、GeoJSON-LD の語彙に展開されます。カタログが新たに定めるのは、これらのジオメトリ全体を表すクラスだけです。"
    en: A value type, not an entity type. Use it as the value of the core location GeoProperty (or another GeoProperty) and reference the schema with $ref from an entity schema. The member names (type, coordinates, bbox) and the geometry types (Point, Polygon and so on) are terms of the NGSI-LD core context and expand to the GeoJSON-LD vocabulary; the catalog mints only the class for any of these geometries.
  - ja: "RFC 7946 よりも厳しくしています。位置は 2 つか 3 つの数値で、マルチ系のジオメトリ、Polygon、GeometryCollection は、少なくとも 1 つのメンバーを持ちます。使えるジオメトリの型は、モデルの側で $ref の横に type の制約を書いて絞ります（DesignatedShelter が Point に絞っているように）。"
    en: "Stricter than RFC 7946 alone: a position has two or three numbers, and a multi-geometry, a Polygon or a GeometryCollection has at least one member. A model narrows the allowed types with a type constraint next to the $ref, as DesignatedShelter does for Point."
  - ja: "RFC 7946 §3.1.6 は、すべての線形リングが閉じている（最初と最後の位置が同じ）ことを求めています。これは JSON Schema では表せないので、カタログの検証ツールが、カタログのすべての例のリングを検査します。利用する側では、GeoJSON を扱えるライブラリでインスタンスを検査してください。"
    en: RFC 7946 §3.1.6 requires every linear ring to close (first and last position identical). JSON Schema cannot express this; the catalog's validator checks the rings of every example in the catalog, and consumers should check instances with a GeoJSON-aware library.
  - ja: "クラス（https://datamodels.jp/ns/common/Geometry）を新たに定めたのは、GeoJSON-LD の語彙（https://purl.org/geojson/vocab#）が個々のジオメトリの型しか定めておらず、ジオメトリ一般のクラスを持たないためです。OGC の Simple Features の語彙（http://www.opengis.net/ont/sf#Geometry）にはそうしたクラスがありますが、NGSI-LD の GeoJSON の値は、Simple Features ではなく GeoJSON-LD の型に展開されます。"
    en: The class is minted (https://datamodels.jp/ns/common/Geometry) because the GeoJSON-LD vocabulary (https://purl.org/geojson/vocab#) defines the individual geometry types but no class for a geometry in general. OGC's Simple Features vocabulary (http://www.opengis.net/ont/sf#Geometry) has such a class, but GeoJSON values in NGSI-LD expand to the GeoJSON-LD types, not to Simple Features.
  - ja: "検討した上流（2026-09-25）は 2 つです。geojson.org の GeoJSON スキーマは JSON Schema draft-07 で、このカタログが使う 2020-12 とは違います。GeometryCollection は別のファイルにあり、URL にバージョンが無く、空の座標の配列も受け付けます。Smart Data Models の Location-Commons（common-schema.json）には、GeometryCollection の無い 6 種類しかありません。再利用できるジオメトリではなく location の属性全体を定義していて、master にしか公開されていません。どちらもそのままでは参照できないので、このスキーマは同じ RFC 7946 の構造に従って書きました。"
    en: "Upstream considered (2026-09-25): the GeoJSON schemas at geojson.org (JSON Schema draft-07 while this catalog uses 2020-12; GeometryCollection in a separate file; unversioned URLs; empty coordinate arrays accepted) and Smart Data Models Location-Commons in common-schema.json (six types without GeometryCollection; defines a whole location property rather than a reusable geometry; published on master only). Neither can be referenced as it is; this schema follows the same RFC 7946 structure."
  - ja: "NGSI-LD のコアコンテキスト（v1.8）は coordinates と bbox を定義していますが、geometries は定義していません。そのため JSON-LD の処理では、GeometryCollection の geometries がコアコンテキストの既定の語彙に展開されます。また、メンバーが 1 つだけのコレクションは、圧縮すると配列ではなくオブジェクトに戻ります。GeoJSON をそのまま保存するブローカーには影響しません。"
    en: The NGSI-LD core context (v1.8) defines coordinates and bbox but not geometries, so in JSON-LD processing a GeometryCollection's geometries expand to the core context's default vocabulary, and a collection with a single member compacts back to an object instead of an array. Brokers that store GeoJSON as it is are not affected.
