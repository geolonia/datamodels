notes:
  - ja: エンティティ型ではなく値型である。`address` Property（IRI https://schema.org/address）の値として使い、エンティティのスキーマから $ref でこのスキーマを参照する。
    en: A value type, not an entity type. Use it as the value of an `address` Property (IRI https://schema.org/address) and reference the schema with $ref from an entity schema.
  - ja: 日本の住所の公式なモデルは、デジタル庁 GIF コアデータモデルの「住所」である。JapaneseAddress は同じ情報を扱い、項目ごとの対応は mapping/gif-address.yaml とこのページにある。GIF は XSD と Excel で公開されていて、JSON-LD でも JSON Schema でもない。この値型があるのはそのためである。
    en: The official Japanese address model is the Digital Agency's GIF core data model 住所 (Address). JapaneseAddress covers the same information; the field-by-field correspondence is in mapping/gif-address.yaml and on the page. GIF is published as XSD and Excel, not as JSON-LD or JSON Schema, which is why this value type exists.
  - ja: schema.org の PostalAddress の語は、意味が合うものを再利用している（addressCountry、postalCode、addressRegion、addressLocality）。streetAddress は使わない。schema.org はこの語で欧米式の住所の番地の行を指すが、GIF は同じ名前を町字に使っている。IRI を再利用すると意味があいまいになるので、構造化した項目と addressText で置き換え、対応は GIF の対応表に記録している。
    en: "schema.org PostalAddress terms are reused where the meaning matches (addressCountry, postalCode, addressRegion, addressLocality). streetAddress is not used: schema.org means the street line of a Western address by it, while GIF uses the same name for 町字. Reusing the IRI would carry an ambiguous meaning; the structured fields and addressText replace it, and the GIF mapping records the correspondence."
  - ja: コードは JIS X 0401（都道府県、2桁）、JIS X 0402（市区町村、5桁）、全国地方公共団体コード（検査数字を含む6桁）に従う。abrMachiazaId はデジタル庁のアドレス・ベース・レジストリの町字ID である。
    en: Codes follow JIS X 0401 (prefecture, 2 digits), JIS X 0402 (municipality, 5 digits) and the 全国地方公共団体コード (6 digits with check digit). abrMachiazaId is the 町字ID of the Digital Agency's Address Base Registry.
  - ja: GeoProperty の座標は、GeoJSON の仕様により WGS84 である。JGD2011 の座標は、ここで必要な精度ではそのまま使える。
    en: GeoProperty coordinates are WGS84 by the GeoJSON specification; JGD2011 coordinates can be used as-is at the precision relevant here.
