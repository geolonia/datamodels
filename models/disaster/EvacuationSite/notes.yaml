notes:
  - "Built on the Digital Agency's 自治体標準オープンデータセット, data item definition sheet A (2026-08-01), sheet 03 指定緊急避難場所一覧 (https://www.digital.go.jp/resources/open_data/municipal-standard-data-set-test), which itself follows GSI's 指定緊急避難場所データ. Field by field in mapping/jichitai-opendata-site.yaml and mapping/gsi-emergency-site.yaml."
  - "Added on 2026-09-28 after the first real record (#85): Utsunomiya City's published list (198 rows) had no model in the catalog, because EvacuationShelter is only the operational overlay. The site master and the overlay stay separate types: 指定緊急避難場所 (Art. 49-4, a place to flee to, designated per hazard) and 指定避難所 (Art. 49-7, a place to stay) are legally distinct, and a place can be both (alsoDesignatedShelter, and EvacuationShelter.site)."
  - "The standard's eight hazard columns (1 = designated, empty = not) become one hazardTypes array; the values follow the standard's own English item names (typeOfDisasterFlood → flood, typeOfDisasterGreatFire → greatFire, typeOfDisasterEruption → eruption)."
  - "Upstream considered (2026-09-28): Smart Data Models has no evacuation site or shelter type. Contact and picture columns of sheet 03 other than the telephone and the web page (extension, e-mail, form URL, remarks on SNS, picture and picture licence) are left out until a system needs them."
  - "Real data seen (#85): lists are published in Shift_JIS as well as UTF-8, codes can lose their leading zero (92011 for 092011), and the structured address columns can be empty while 所在地_連結表記 carries the whole address. Only addressText is reliable; the structured JapaneseAddress fields stay empty then."
