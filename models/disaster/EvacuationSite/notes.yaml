notes:
  - ja: デジタル庁の自治体標準オープンデータセット、データ項目定義書A（2026-08-01）、シート「03 指定緊急避難場所一覧」（https://www.digital.go.jp/resources/open_data/municipal-standard-data-set-test）に基づく。このシート自体は国土地理院の指定緊急避難場所データに従っている。項目ごとの対応は mapping/jichitai-opendata-site.yaml と mapping/gsi-emergency-site.yaml にある。
    en: Built on the Digital Agency's 自治体標準オープンデータセット, data item definition sheet A (2026-08-01), sheet 03 指定緊急避難場所一覧 (https://www.digital.go.jp/resources/open_data/municipal-standard-data-set-test), which itself follows GSI's 指定緊急避難場所データ. Field by field in mapping/jichitai-opendata-site.yaml and mapping/gsi-emergency-site.yaml.
  - ja: 最初の実データ（#85）の後、2026-09-28 に追加した。宇都宮市が公開する一覧（198行）にあたるモデルがカタログに無かった。EvacuationShelter は運用状況のオーバーレイでしかないためである。避難場所のマスタとオーバーレイは別の型のままにする。指定緊急避難場所（第49条の4、逃げる場所。災害種別ごとに指定）と指定避難所（第49条の7、滞在する場所）は法的に別のもので、同じ場所が両方を兼ねることがある（alsoDesignatedShelter と EvacuationShelter.site）。
    en: "Added on 2026-09-28 after the first real record (#85): Utsunomiya City's published list (198 rows) had no model in the catalog, because EvacuationShelter is only the operational overlay. The site master and the overlay stay separate types: 指定緊急避難場所 (Art. 49-4, a place to flee to, designated per hazard) and 指定避難所 (Art. 49-7, a place to stay) are legally distinct, and a place can be both (alsoDesignatedShelter, and EvacuationShelter.site)."
  - ja: 標準の 8 つの災害種別の列（1 = 指定、空 = 指定なし）は、1 つの hazardTypes の配列にまとめる。値は標準自身の英語の項目名に従う（typeOfDisasterFlood → flood、typeOfDisasterGreatFire → greatFire、typeOfDisasterEruption → eruption）。
    en: The standard's eight hazard columns (1 = designated, empty = not) become one hazardTypes array; the values follow the standard's own English item names (typeOfDisasterFlood → flood, typeOfDisasterGreatFire → greatFire, typeOfDisasterEruption → eruption).
  - ja: 検討した上流（2026-09-28）：Smart Data Models には避難場所・避難所の型が無い。シート 03 の連絡先と画像の列のうち、電話番号とウェブページ以外（内線、メールアドレス、フォームの URL、SNS についての備考、画像と画像のライセンス）は、必要とするシステムが現れるまで入れない。
    en: "Upstream considered (2026-09-28): Smart Data Models has no evacuation site or shelter type. Contact and picture columns of sheet 03 other than the telephone and the web page (extension, e-mail, form URL, remarks on SNS, picture and picture licence) are left out until a system needs them."
  - ja: 見えた実データ（#85）：一覧は UTF-8 だけでなく Shift_JIS でも公開されている。コードは先頭の 0 を失うことがある（092011 が 92011）。構造化された住所の列が空で、所在地_連結表記 が住所全体を持つこともある。確実なのは addressText だけで、その場合 JapaneseAddress の構造化された項目は空のままになる。
    en: "Real data seen (#85): lists are published in Shift_JIS as well as UTF-8, codes can lose their leading zero (92011 for 092011), and the structured address columns can be empty while 所在地_連結表記 carries the whole address. Only addressText is reliable; the structured JapaneseAddress fields stay empty then."
