title:
  ja: 通報
  en: Incident report
description:
  ja: 住民や職員からの通報 1 件。位置、カテゴリ、対応状況、入力者、通報者（個人情報）を持つ。タスク管理サブジェクトの Task のサブクラスで、name・progress などの属性はタスクの IRI を共有する。
  en: "One report from a resident or staff member: location, category, response status, who entered it, and the reporter (personal data). A subclass of Task in the task subject: name, progress and the other shared attributes use the task IRIs."
status: draft
tags:
  - disaster-response
  - municipality
attributes:
  name:
    ja: 通報の短い表題（カテゴリと場所など）
    en: Short title of the report, for example category and place
  description:
    ja: 自由記述（通報内容、現地の状況）
    en: "Free text: what was reported, current findings"
  project:
    ja: 所属する災害事象（DisasterEvent）
    en: The disaster event (DisasterEvent) this entity belongs to
  externalId:
    ja: 災害事象内の通報連番（文字列）
    en: Sequence number of the report within the disaster event, as a string
  progress:
    ja: 正規化した対応状況（RFC 8984 progress）。従来の値は 対応中 → in-process、対応済み → in-process、保留 → needs-action、完了 → completed
    en: Normalised response state (RFC 8984 progress). The original labels map as 対応中 → in-process, 対応済み → in-process, 保留 → needs-action, 完了 → completed
  statusLabel:
    ja: 本部での対応状況の呼び方（対応中、対応済み、保留、完了）
    en: The response status as the headquarters names it (対応中, 対応済み, 保留, 完了)
  subtype:
    ja: カテゴリ（冠水、土砂災害、倒壊、倒木、断線など。列挙は固定しない）
    en: Category such as flooding, landslide, collapse, fallen tree, broken line. Not a closed list
  author:
    ja: 入力した人・班（エンティティの URN）
    en: The person or team who entered the report (an entity URN)
  reportedAt:
    ja: 通報日時
    en: Date and time the report was received
  pressReleaseStatus:
    ja: プレスリリース区分
    en: Press-release status
  address:
    ja: 住所（common サブジェクトの JapaneseAddress 値）
    en: Address, as a JapaneseAddress value from the common subject
  location:
    ja: 位置
    en: Location
  reporterName:
    ja: 通報者名【個人情報】
    en: Reporter name (personal data)
  reporterPhone:
    ja: 通報者電話番号【個人情報】
    en: Reporter phone number (personal data)
  reporterAddress:
    ja: 通報者住所【個人情報】
    en: Reporter address (personal data)
  dateModified:
    ja: 元システムでの最終更新日時。ブローカーのシステム属性 modifiedAt とは別に、アプリが業務上の更新として記録する時刻
    en: Last modification in the source system, recorded by the application as a business update, separate from the broker system attribute modifiedAt
