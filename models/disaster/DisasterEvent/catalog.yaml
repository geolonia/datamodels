title:
  ja: 災害事象
  en: Disaster event
description:
  ja: 台風や豪雨など 1 つの災害事象と、それに対する対応全体を束ねる単位。通報・対応業務・通行止めなどが所属する。タスク管理サブジェクトの Project と同じ型（エイリアス、IRI は同一）で、名称だけを災害対応の言い方に合わせている。
  en: "One disaster event and the whole response to it, such as a typhoon or heavy rain: the unit that bundles reports, actions and closures. The same type as Project in the task subject (an alias, identical IRI), named the way disaster response talks about it."
status: draft
tags:
  - disaster-response
  - municipality
attributes:
  name:
    ja: 名称・件名
    en: Name or subject
  description:
    ja: 説明
    en: Description
  identifier:
    ja: 短い識別子（スラッグやコード。元システム内で一意）
    en: "Short handle: a slug or code, unique within the source system"
  parent:
    ja: 親プロジェクト
    en: Parent project
  projectStatus:
    ja: 状態。core context の status は予約語のため projectStatus
    en: State; status is protected in the core context, hence projectStatus
  isPublic:
    ja: 公開プロジェクトなら true
    en: true when public
  homepage:
    ja: ホームページ
    en: Homepage
  start:
    ja: 予定期間の開始
    en: Planned start
  end:
    ja: 予定期間の終了
    en: Planned end
  location:
    ja: 位置。点・線・面・それらの集合など任意の GeoJSON ジオメトリ
    en: "Location as any GeoJSON geometry: point, line, polygon or a collection"
  keywords:
    ja: キーワード・ラベル
    en: Keywords or labels
  source:
    ja: 元システムにおけるこのオブジェクトの URL
    en: URL of this object in the system of record
  externalId:
    ja: 元システムにおける識別子
    en: Identifier in the system of record
  dateCreated:
    ja: 元システムでの作成日時（ブローカーの createdAt とは別）
    en: Creation time in the system of record (distinct from the broker attribute createdAt)
  dateModified:
    ja: 元システムでの更新日時
    en: Last modification time in the system of record
