title:
  ja: 指定避難所
  en: Designated shelter
description:
  ja: 指定避難所（災害対策基本法第49条の7）1か所を表す。避難した人が一定期間滞在する施設の基本情報（名称・所在地などをまとめたマスタ）で、市町村が登録し国土地理院が公開する。開設状況や避難者数は持たない（それは EvacuationShelter で表し、shelter でここを参照する）。
  en: One designated shelter (指定避難所, Basic Act on Disaster Management Art. 49-7), the master record of a facility where evacuees stay for a while, as municipalities register it and GSI publishes it. Opening status and evacuee counts are not here (that is EvacuationShelter, which links here with shelter).
status: draft
tags:
  - disaster-response
  - municipality
attributes:
  name:
    ja: 指定避難所の名称（施設の名前）
    en: Name of the shelter (the facility's name)
  nameKana:
    ja: 施設名の読み（全角カタカナ）
    en: Name in full-width katakana
  externalShelterId:
    ja: 市町村の避難所一覧における ID（市町村内で一意）。nationalShelterId が無いときは必須
    en: The shelter's ID in the municipality's own list (unique within it). Required when nationalShelterId is not given
  nationalShelterId:
    ja: "全国共通避難所・避難場所ID（14桁、国土地理院のデータの「共通ID」）。このモデルでは種別コード 11（一般の指定避難所）か 12（福祉避難所）のものだけ有効。構造と出典は、EvacuationShelter の対応表「全国共通避難所・避難場所ID」（gsi-national-shelter-id）にまとめている。externalShelterId が無いときは必須"
    en: "The nationwide common shelter/evacuation-site ID (14 characters, the '共通ID' of GSI's data). Only type codes 11 (general designated shelter) and 12 (welfare shelter) are valid on this model. Its structure and source are described once, in EvacuationShelter's mapping 'nationwide common shelter/evacuation-site ID' (gsi-national-shelter-id). Required when externalShelterId is not given"
  localGovernmentCode:
    ja: 指定する市町村の全国地方公共団体コード（検査数字を含む6桁）
    en: Local government code (6 digits including the check digit) of the municipality that designates the shelter
  shelterType:
    ja: general（一般避難所）または welfare（福祉避難所、特別な配慮が必要な人のため）。nationalShelterId の種別コードの2桁目と同じ
    en: general (一般避難所) or welfare (福祉避難所, for people who need special care); the same as the second type digit of nationalShelterId
  address:
    ja: 所在地（JapaneseAddress）
    en: Address of the shelter (JapaneseAddress)
  location:
    ja: 位置（点）
    en: Location (a point)
  maxCapacity:
    ja: 想定収容人数
    en: Number of people the shelter is planned to hold
  targetEvacuees:
    ja: 受入対象者（市町村の書き方のまま。福祉避難所の対象など）
    en: Who the shelter is for, in the municipality's words (for example for a welfare shelter)
  alsoEmergencyEvacuationSite:
    ja: 同じ住所に指定緊急避難場所があるとき true（指定緊急避難場所との住所同一）
    en: true when a designated emergency evacuation site has the same address
  site:
    ja: 同じ場所の指定緊急避難場所（EvacuationSite）
    en: The designated emergency evacuation site (EvacuationSite) at the same place
  designationNotes:
    ja: その他市町村長が必要と認める事項
    en: Other matters the mayor considers necessary
  description:
    ja: 備考
    en: Remarks
