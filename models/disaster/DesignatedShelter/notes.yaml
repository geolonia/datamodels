notes:
  - "Built on GSI's designated shelter data (指定避難所データ, one CSV per municipality, https://hinanmap.gsi.go.jp/hinanjocp/hinanbasho/koukaidate.html), which municipalities register under the Basic Act on Disaster Management Art. 49-7. The type codes follow the nationwide common ID (Cabinet Office, 2024-11-07). Field by field in mapping/gsi-designated-shelter.yaml."
  - "Added on 2026-09-29 as the master that EvacuationShelter (the operation of a shelter) points to; until then it referenced the master only by ID. With EvacuationSite (the 指定緊急避難場所 a municipality publishes) both designations the law separates now have a master. A place can be both: site links them, and the facility code inside the two common IDs is the same (都立一橋高校: E1310100012111 as a shelter, E1310100012201 as a site)."
  - "The 自治体標準オープンデータセット has no dataset for designated shelters, so GSI's data is the published source. Capacity is not in GSI's list; maxCapacity is for municipal lists that have it."
  - "Upstream considered (2026-09-29): Smart Data Models has no shelter type."
