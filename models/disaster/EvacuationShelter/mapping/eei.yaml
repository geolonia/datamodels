# Correspondence between EvacuationShelter and the Cabinet Office's EEI
# (災害対応基本共有情報) version 1.1, item 21 避難所等: 避難所 (災害時取得).
standard:
  name:
    ja: 災害対応基本共有情報（EEI）第1.1版（内閣府（防災担当）、2025年6月）「21 避難所等：避難所」の災害時取得の属性
    en: "Essential Elements of Information (EEI, 災害対応基本共有情報) version 1.1 (Cabinet Office, June 2025), item 21 避難所等: 避難所 (shelters), the attributes collected during a disaster (災害時取得)"
  url: https://www.bousai.go.jp/kaigirep/kentokai/dataplatform/pdf/jitsumu/r7/dai2kai/siryo1.pdf
  license:
    ja: "内閣府ホームページ利用規約による公共データ利用規約（第1.0版）（PDL1.0、CC BY 4.0 と互換）"
    en: "Public Data License (Version 1.0) (PDL1.0) under the Cabinet Office website terms of use (内閣府ホームページ利用規約), compatible with CC BY 4.0"
  note:
    ja: "EEI の説明と「基本」「特定」の区分は EvacuationSite の対応表を参照。平時整備の属性（施設名、所在地、避難所タイプなど）は DesignatedShelter にあり、shelter でたどる。基本共有データ属性の開設状況と避難者数（総数）は本モデルにある。特定データ属性のうち、開設理由、定員状況、必要な人的支援、飲料水、トイレの数、支援が必要な物資、感染症対策の物資の不足と必要数、居住環境（スペース、ベッド、入浴、洗濯、毛布）などは本モデルに無い。避難所開設情報（都道府県別集計）は集計値で、個々の避難所から数える。"
    en: "For what EEI is and its 基本 (basic) and 特定 (specific) classes, see the EvacuationSite table. The attributes kept in normal times (name, address, shelter type) are in DesignatedShelter, reached through shelter. The basic attributes 開設状況 and 避難者数（総数） have fields here. Specific attributes with no field: 開設理由 (reason for opening), occupancy against capacity, needed staff support, drinking water, toilet counts, needed supplies, infection-control supplies (shortage and number needed) and living conditions (space, beds, bathing, laundry, blankets). 避難所開設情報（都道府県別集計） is a total, counted from the individual shelters."
fields:
  nationalShelterId: { to: 全国共通避難所・避難場所ID（基本） }
  localGovernmentCode: { to: 地方公共団体コード（基本） }
  openingStatus:
    to: 開設状況（基本）
    note:
      ja: "EEI の値は未開設、開設、閉鎖、不明、常設など。open → 開設（常設の避難所も open とし、statusLabel に「常設」）、closed → 未開設（まだ開いていない）または閉鎖（開設後に閉じた）。どちらかは statusLabel と openedAt で分かる。full → 開設（開いたまま満員。定員の状況は EEI の定員状況（特定）で、本モデルには無い）、requested → 未開設。不明は openingStatus を省き、statusLabel に「不明」"
      en: "EEI's values are 未開設 (not open yet), 開設 (open), 閉鎖 (closed), 不明 (unknown), 常設 (permanent) and the like. open → 開設 (a permanent shelter is open too, with 常設 in statusLabel); closed → 未開設 if it never opened or 閉鎖 if it closed after opening, as statusLabel and openedAt tell; full → 開設 (open and at capacity; EEI's 定員状況, specific, has no field here); requested → 未開設. For 不明, leave openingStatus out and put 不明 in statusLabel"
  statusLabel:
    to: 開設状況（基本）
    note:
      ja: 現場の呼び方。EEI の値に当たらないときはこちらを送る
      en: the local wording; send it when no EEI value fits
  evacueeTotal:
    to: 避難者数（総数）（基本）
    note:
      ja: EEI では男女の合計で、自主避難者を含む
      en: in EEI the sum of men and women, including people who came on their own
  evacueeMale: { to: 避難者数（男）（特定） }
  evacueeFemale: { to: 避難者数（女）（特定） }
  shelter:
    to: null
    note:
      ja: EEI では平時整備と災害時取得を同じ全国共通避難所・避難場所ID で結ぶ
      en: EEI joins the two sets of attributes by the same 全国共通避難所・避難場所ID
  site: { to: null }
  externalShelterId: { to: null }
  evacueeHouseholds: { to: null }
  openedAt: { to: 開設日時（特定） }
  closedAt: { to: 閉鎖日時（特定） }
  description: { to: null }
