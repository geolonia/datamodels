standard:
  name:
    ja: 自治体標準オープンデータセット・データ項目定義書A（20260801版）シート「03.指定緊急避難場所一覧」（デジタル庁）
    en: "Municipal standard open dataset, data item definition sheet A (2026-08-01), sheet '03. designated emergency evacuation sites' (Digital Agency)"
  url: https://www.digital.go.jp/resources/open_data/municipal-standard-data-set-test
  license:
    ja: "公共データ利用規約（第1.0版）（PDL1.0、CC BY 4.0 と互換）"
    en: "Public Data License (Version 1.0) (PDL1.0), compatible with CC BY 4.0"
  note:
    ja: "自治体が公開する指定緊急避難場所のマスタ。このシートは「指定緊急避難場所」（災害対策基本法第49条の4）の定義で、このモデルが対象とする「指定避難所」（同法第49条の7）とは法的に別の概念。シートの行は EvacuationSite にあたり、この運用状況からは site で参照する（指定避難所が指定緊急避難場所を兼ねるとき）。指定避難所そのものは DesignatedShelter で、shelter か nationalShelterId で参照する（mapping/gsi-national-shelter-id.yaml）。避難者数はマスタに無い。"
    en: "The master of designated emergency evacuation sites a municipality publishes. This sheet defines 指定緊急避難場所 (designated emergency evacuation site, Basic Act on Disaster Management Art. 49-4), a legally distinct concept from the 指定避難所 (designated shelter, Art. 49-7) this model is about. A row of the sheet is an EvacuationSite, which this operation record links with site when the shelter is also a site. The shelter itself is a DesignatedShelter, referenced by shelter or nationalShelterId (mapping/gsi-national-shelter-id.yaml). Evacuee counts are not in the master."
fields:
  externalShelterId:
    to: null
    note:
      ja: 項目No.2 の ID は指定緊急避難場所の ID で、EvacuationSite の externalSiteId にあたる（site の行）。externalShelterId は市町村の避難所一覧の ID
      en: "the ID of item No. 2 identifies the emergency evacuation site, EvacuationSite's externalSiteId (see the site row); externalShelterId is the ID in the municipality's shelter list"
  site:
    to: ID (項目No.2)
    note:
      ja: この ID（EvacuationSite の externalSiteId）と localGovernmentCode で EvacuationSite を探して参照する
      en: find the EvacuationSite by this ID (its externalSiteId) and localGovernmentCode, and link it
  nationalShelterId:
    to: null
    note:
      ja: このデータセットには無い。GSI の指定緊急避難場所・指定避難所データが「共通ID」列として持つ（mapping/gsi-national-shelter-id.yaml 参照）
      en: "not present in this dataset; carried as the '共通ID' column of GSI's designated-shelter data instead (see mapping/gsi-national-shelter-id.yaml)"
  localGovernmentCode:
    to: 全国地方公共団体コード (項目No.1, localGovernmentCode)
  openingStatus:
    to: null
  statusLabel:
    to: null
  evacueeHouseholds:
    to: null
  evacueeTotal:
    to: null
    note:
      ja: 想定収容人数（maxCapacity）はマスタ側（EvacuationSite の maxCapacity）
      en: maxCapacity is on the master side (EvacuationSite's maxCapacity)
  evacueeFemale:
    to: null
  evacueeMale:
    to: null
  description:
    to: 備考 (remarks)
    note:
      ja: 意味は異なる（マスタの備考と運用メモ）
      en: "different meaning: master remarks vs operational memo"
  openedAt:
    to: null
  closedAt:
    to: null
