title:
  ja: 避難所運用状況
  en: Evacuation shelter operation
description:
  ja: 避難所の運用状況オーバーレイ1件。避難所そのもののマスタ（名称・位置）は含まず、外部の避難所データを externalShelterId で参照する。開設状況と避難者数だけを持つ。
  en: Operational overlay for one evacuation shelter. The shelter master data (name, location) is not included; it is referenced by externalShelterId. Only opening status and evacuee counts live here.
status: draft
tags:
  - disaster-response
  - municipality
attributes:
  project:
    ja: 所属する災害事象（DisasterEvent）
    en: The disaster event (DisasterEvent) this entity belongs to
  externalShelterId:
    ja: 自治体の指定緊急避難場所一覧（推奨データセット）における ID（自治体内で一意。例 CC0100022200）。localGovernmentCode と合わせて全国で一意になる
    en: The shelter's ID in the municipality's 指定緊急避難場所一覧 (推奨データセット; unique within the municipality, e.g. CC0100022200). Together with localGovernmentCode it identifies the shelter nationwide
  localGovernmentCode:
    ja: 一覧を公開する自治体の全国地方公共団体コード（6 桁）
    en: Local government code of the municipality that publishes the shelter list (全国地方公共団体コード, 6 digits)
  openingStatus:
    ja: "正規化した開設状況: open（開設中）、closed（未開設・閉鎖）、full（満員）。現場の呼び方は statusLabel に"
    en: "Normalised opening state: open, closed, full (open but at capacity). The local wording goes in statusLabel"
  statusLabel:
    ja: 本部での開設状況の呼び方（未開設、開設中、満員）
    en: The opening status as the headquarters names it (未開設, 開設中, 満員)
  evacueeHouseholds:
    ja: 避難世帯数
    en: Number of evacuated households
  evacueeTotal:
    ja: 避難人数合計
    en: Total number of evacuees
  evacueeFemale:
    ja: 避難人数（女）
    en: Number of female evacuees
  evacueeMale:
    ja: 避難人数（男）
    en: Number of male evacuees
  description:
    ja: メモ
    en: Free-text memo
  openedAt:
    ja: 開設日時
    en: Time the shelter opened
  closedAt:
    ja: 閉鎖日時
    en: Time the shelter closed
