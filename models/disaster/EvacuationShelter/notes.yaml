notes:
  - ja: 高松市の水防本部アプリの Custom Data Model から派生した（2026年9月。元のソースは非公開）。型名はテナント固有の接頭辞「Saitai」を外して一般化し、属性名はタスク管理のサブジェクトに合わせた。
    en: Derived from the Custom Data Models of the Takamatsu City flood-prevention headquarters application (September 2026; its source is not public). Type names generalised from the tenant-specific "Saitai" prefix; attribute names aligned with the task subject.
  - ja: 元のアプリからの変更：status → openingStatus（open | closed | full | requested に正規化し、現場の呼び方は statusLabel に残す）。避難者数は整数にした（元は文字列）。memo → description。requested は、元のアプリの「依頼中」（開設を依頼・指示されたが、まだ確認できていない）にあたる。
    en: "From the source application: status → openingStatus, normalised to open | closed | full | requested, with the local wording in statusLabel; evacuee counts are integers (strings in the source); memo → description. requested covers the application's 依頼中 (opening requested or instructed, not yet confirmed)."
  - ja: このモデルは指定避難所（災害対策基本法第49条の7）の運用を表す。法は指定避難所を指定緊急避難場所（第49条の4）と区別している。指定避難所そのものは DesignatedShelter で、運用状況は shelter、externalShelterId（DesignatedShelter と同じく、市町村の避難所一覧の ID）、nationalShelterId のどれかでそれを指し、どれか 1 つは必須である（2026-09-30、#118。それまでは externalShelterId が必須で、一覧 03 の ID を意味していた）。デジタル庁の自治体標準オープンデータセット（2023-03-31 から推奨データセットの後継）の一覧 03 は指定緊急避難場所だけを扱い、その ID は EvacuationSite（externalSiteId）を指す。これを site で参照する。国土地理院は両方の全国一覧を別々に公開していて、どちらにも共通ID の列がある。
    en: "This model is the operation of a 指定避難所 (designated shelter, Basic Act on Disaster Management Art. 49-7), which the law distinguishes from a 指定緊急避難場所 (designated emergency evacuation site, Art. 49-4). The shelter itself is a DesignatedShelter; an operation record names it by shelter, by externalShelterId (the municipality's own ID for the shelter, as on DesignatedShelter) or by nationalShelterId, and one of the three is required (2026-09-30, #118; externalShelterId was required before and meant the ID of list 03). List 03 of the Digital Agency 自治体標準オープンデータセット (successor of the 推奨データセット since 2023-03-31) covers only 指定緊急避難場所: its ID identifies an EvacuationSite (externalSiteId), which site links. The GSI publishes separate nationwide lists for both kinds, each with a 共通ID column."
  - ja: nationalShelterId はその共通ID で、内閣府の新総合防災情報システム（SOBO-WEB）の14文字の全国共通の避難所 ID である（2024-11-07 の資料）。内閣府は同じ ID で開設状況と避難者数を避難所に結び付ける。これはこのモデルが表すオーバーレイと同じ考え方である。
    en: "nationalShelterId is that 共通ID: the 14-character nationwide shelter ID of the Cabinet Office's SOBO-WEB system (slides of 2024-11-07). The Cabinet Office uses the same ID to join opening status and evacuee counts to the shelter, which is the overlay this model describes."
  - ja: 内閣府の避難所運営ガイドライン（平成28年4月、令和6年12月改定）は、開設状況の確認と公表、避難者数の報告を運営の業務として挙げているが、開設状況のコード表は定めていない。openingStatus の値はこのカタログの正規化で、現場の呼び方は statusLabel に残す。
    en: The Cabinet Office shelter-operation guideline (April 2016, revised December 2024) names confirming and publishing the opening status and reporting evacuee counts as operational tasks, but defines no code list for the status. The openingStatus values are this catalog's normalisation; statusLabel keeps the local wording.
  - ja: localGovernmentCode は総務省の全国地方公共団体コード仕様（平成19年4月1日）に従う。JIS X 0401・X 0402 の5桁のコードに検査数字を加えたものである。
    en: "localGovernmentCode follows the MIC specification of the 全国地方公共団体コード (2007-04-01): 5-digit JIS X 0401/X 0402 code plus a check digit."
  - ja: 検討した上流：Smart Data Models には避難所の型が無い。見送ったもの：避難者数の昼夜の内訳（内閣府の避難所日報の様式、2020年）。一般避難所・福祉避難所の種別と収容人数は、この運用状況ではなく避難所そのものに属するので、DesignatedShelter の shelterType と maxCapacity で表す。
    en: "Upstream considered: Smart Data Models has no shelter type. Deferred: a day and night split of evacuee counts (Cabinet Office daily shelter report form, 2020). The 一般避難所 / 福祉避難所 type and the capacity belong to the shelter, not to this operational overlay: they are shelterType and maxCapacity on DesignatedShelter."
  - ja: project の関係（タスク管理の Project へ）は 2026-09-25 に削除した（#66）。元のアプリでは、すべてのエンティティが 1 つの災害に属していたことに由来するもので、避難所のガイドラインにも自治体のデータセットにも無い。避難所を業務ごとにまとめるのはアプリケーションに任せる。タスク管理の Task が refersTo で避難所を指すか、拡張したモデルが独自の関係を足す。
    en: "The project relationship (to a task subject Project) was removed on 2026-09-25 (#66): it came from the source application, where every entity belonged to one disaster event, and neither the shelter guidelines nor the municipal dataset has it. Grouping shelters by operation is left to the application: a task subject Task points at a shelter with refersTo, or an extended model adds its own relationship."
  - ja: "site（2026-09-28、#85）：自治体が公開する指定緊急避難場所の型がカタログにできたので、同じ場所の EvacuationSite を指す。指定避難所そのものにも #105（2026-09-28）から型がある。国土地理院の指定避難所データに基づく DesignatedShelter で、shelter で参照する。"
    en: "site (2026-09-28, #85): links to the EvacuationSite at the same place, now that the catalog has a type for the 指定緊急避難場所 a municipality publishes. The 指定避難所 itself has a type too since #105 (2026-09-28): DesignatedShelter, from GSI's designated shelter data, which shelter links."
