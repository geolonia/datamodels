notes:
  - Derived from the Custom Data Models of the Takamatsu City flood-prevention headquarters application (geolonia/geonicdb-datamodels, September 2026). Type names generalised from the tenant-specific "Saitai" prefix; attribute names aligned with the task subject.
  - "From the source application: status → openingStatus, normalised to open | closed | full, with the local wording in statusLabel; evacuee counts are integers (strings in the source); memo → description."
  - "Upstream considered (2026-09-18): Smart Data Models has no shelter type. The Japanese reference is the Digital Agency 自治体標準オープンデータセット (successor of the 推奨データセット since 2023-03-31), list 03 指定緊急避難場所一覧, derived from the GSI 指定緊急避難場所データ. It is master data: name, address, coordinates, disaster kinds handled, maxCapacity. This type is the operational overlay and carries no master fields; the master could become an EvacuationSite type later, referenced by Relationship."
  - externalShelterId is the ID column of that list, unique within the municipality; together with localGovernmentCode it identifies the shelter nationwide.
  - "Rebaseline research (2026-09-24), rebuilding this model on public guidelines per the tracking issue (see the repository issue list). Sources checked (URL, publisher, version/date):"
  - "① デジタル庁 自治体標準オープンデータセット・データ項目定義書A（20250501版）, シート「03.指定緊急避難場所一覧」: https://www.digital.go.jp/assets/contents/node/basic_page/field_ref_resources/5345f63e-62aa-4ef5-b979-287b6f343e2a/0d6cbe5f/20250501_resources_open_data_municipal-standard-open-dataset_table_a.xlsx — downloaded and parsed directly (openpyxl). Confirms item No.1 全国地方公共団体コード=6桁, item No.2 ID (externalShelterId), item No.33 指定避難所との重複 (i.e. 指定緊急避難場所 and 指定避難所 are distinct lists). Table A defines no 指定避難所 sheet."
  - "② 災害対策基本法（昭和36年法律第223号）第49条の4（指定緊急避難場所）・第49条の7（指定避難所）: the two concepts are legally distinct (immediate-danger evacuation vs. staying shelter). This model (避難所運用状況) is about 指定避難所 (Art. 49-7); externalShelterId/list 03 above is technically the 指定緊急避難場所 list, since the Digital Agency dataset has no 指定避難所 item definition. Confirmed via GSI: https://www.gsi.go.jp/bousaichiri/hinanbasho-menseki.html"
  - "③ 国土地理院（国土交通省）指定緊急避難場所・指定避難所データダウンロードサイト: https://hinanmap.gsi.go.jp/hinanjocp/hinanbasho/koukaidate.html — confirmed (WebFetch, 2026-09-24) that GSI separately publishes BOTH 指定緊急避難場所（全国版） and 指定避難所（全国版） CSVs, each carrying a 共通ID column (the nationalShelterId below). This is the more accurate master-data source for this model's subject than Digital Agency list 03."
  - "④ 内閣府（防災担当）「全国共通避難所・避難場所ID」: 新総合防災情報システム（SOBO-WEB）のご紹介, 令和6年11月7日: https://www.bousai.go.jp/taisaku/hinanjo/r6_setsumeikai/pdf/shiryo10.pdf (slide 6). 14-digit structure: fixed 'E' + 5-digit municipality code + 5-digit facility code + type code (1-digit major: 1=指定避難所/2=指定緊急避難場所; 1-digit minor: 1=一般避難所/2=福祉避難所, 0 if major=2) + 1-digit/char sequence. Slide 7 shows this ID as the join key between 開閉情報 (opening/closing info) and 避難者数 (evacuee count) layers in SOBO-WEB — i.e. the government's own EEI design matches this model's overlay pattern. Mapped to nationalShelterId."
  - "⑤ 内閣府（防災担当）「避難所運営等避難生活支援のためのガイドライン（チェックリスト）」平成28年4月（令和6年12月改定）: https://www.bousai.go.jp/taisaku/hinanjo/pdf/2412hinanjo_guideline.pdf. Checklist items 1-3 避難所の開設状況の確認 (p.25), 2-1 避難所の開設状況を周知する (p.28), 5-2 避難者人数の定期報告 (p.26) establish 開設状況 and 避難者数 as recognised operational-tracking concepts. The guideline does NOT define a controlled vocabulary of status values (no open/closed/full/requested-equivalent code list found) — openingStatus's enum values, including the new 'requested', are this catalog's own normalisation, not a copied public code list. statusLabel remains the required escape hatch for any local wording (see ⑥)."
  - "⑥ Takamatsu City flood-prevention headquarters application added a fourth production status value, 依頼中 (~'opening requested/instructed, not yet confirmed'), on 2026-09-18; it has no counterpart in ④ or ⑤ above. Mapped to openingStatus=requested with statusLabel='依頼中'."
  - "⑦ 総務省「全国地方公共団体コード仕様」（平成19年4月1日）: https://www.soumu.go.jp/main_content/000137948.pdf and https://www.soumu.go.jp/denshijiti/code.html. Confirms 6 digits (5-digit JIS X0401/X0402 code + 1 modulus-11 check digit). No change needed to localGovernmentCode's existing pattern/required status; description updated to cite the source."
  - "Considered and deferred (kept out of this rebaseline to stay a minimal overlay): a day/night evacuee split (夜/昼, from the Cabinet Office's 2020 避難所日報 form, 資料3-2: https://www.bousai.go.jp/taisaku/hisaisyagyousei/pdf/3kai_3-2.pdf) — evacueeTotal stays a single count; 指定一般避難所/指定福祉避難所 subtype and 想定収容人数/maxCapacity — these belong to the shelter master, not this operational overlay, consistent with the existing design."
  - "🔴 URL contract check (2026-09-24): schema/disaster/EvacuationShelter/v1.0.0.json was already recorded in published-manifest.json with a SHA-256 hash. Left as originally found, that would make this an immutability violation under guide/urls's stated promise (draft-vs-stable in catalog.yaml is a promotion gate, not an immutability exemption; check-immutability.mjs keys strictly off published-manifest.json, never off status). Per the commander's explicit call (2026-09-24) that nothing under models/disaster/ has actually shipped to the public yet, this PR instead REBASELINES v1.0.0 in place: published-manifest.json's entries for schema/disaster/EvacuationShelter/v1.0.0.json, context/disaster/v1.0.0.jsonld and vocab/disaster/v1.0.0.jsonld are removed and re-recorded against the new content (the releases/v1.0.0/ snapshot files for those three are regenerated the same way); subject.yaml stays at version 1.0.0, and this PR does not touch the version or any file of the other 6 disaster-subject models. From the point this rebaseline merges, the normal 'a published version never changes' contract starts applying for real; any further change to EvacuationShelter (or a status:draft→stable promotion) needs a new version. Coordination: 部下152's PR deletes 5 of the 7 disaster-subject models and also rebaselines v1.0.0/published-manifest.json/releases/v1.0.0/, and is expected to merge before this one; 部下154's PR touches RoadClosure only. All three PRs touch the same shared subject.yaml/context.jsonld/vocab/published-manifest.json/releases/v1.0.0/ files, so a rebase after 152 merges (and again after 154, if concurrent) is expected — this PR's diff to those shared files is kept to the minimum needed for EvacuationShelter (one context term) to ease that."
