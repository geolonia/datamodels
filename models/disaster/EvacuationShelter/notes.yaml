notes:
  - Seeded 2026-09-17 from geolonia/geonicdb-datamodels data-models/*.json (Takamatsu City flood-prevention headquarters). Type name generalised from the tenant-specific "Saitai" prefix.
  - The original attribute "status" is renamed because status is a protected term in the NGSI-LD core context and cannot be redefined.
  - Evacuee counts are integers here; the original application stored them as strings.
  - openingStatus has the two values of the source application (未開設, 開設中). Whether a closed shelter is 未開設 again or needs a third value such as 閉鎖 is an open question for the operating team; the example therefore shows an open shelter without closedAt.
  - "2.0.0: project now uses the task subject's project IRI and points at DisasterEvent; memo → description (core term)."
  - "Upstream considered (2026-09-18): Smart Data Models has no shelter type. The Japanese reference is the Digital Agency 推奨データセット 03 指定緊急避難場所一覧 (derived from the GSI 指定緊急避難場所データ), which is master data: name, address, coordinates, disaster kinds handled, maxCapacity. This type is the operational overlay and carries no master fields; the master could become an EvacuationSite type later, referenced by Relationship."
  - "3.0.0: externalShelterId is defined as the 推奨データセット ID and localGovernmentCode is added so the pair is unique nationwide; openingStatus normalised to open | closed | full with the local wording in statusLabel."
