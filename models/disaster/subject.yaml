# Subject metadata. One context per subject, versioned; the version below is the
# version of context.jsonld and of every schema in this subject.
name: disaster
version: 1.0.0
title:
  ja: 災害対応
  en: Disaster response
description:
  ja: 自治体の災害対応を表すデータモデル。現在は避難所運用状況（EvacuationShelter）。独自の型で、状態の呼び方（statusLabel）はタスク管理の IRI を使います。災害対応のオペレーションとのひも付けはアプリケーション側で行います（タスク管理の Task の refersTo など）。通行止めなどの通行規制は交通（transportation）サブジェクトの RoadRestriction です。高松市の水防アプリのデータモデルを基に汎用化したもの。
  en: Data models for municipal disaster response. Currently shelter operation (EvacuationShelter), its own type; the local status wording (statusLabel) uses the task subject's IRI. Linking entities to a disaster-response operation is left to the application (for example refersTo from a task subject Task). Road closures and other road restrictions are RoadRestriction in the transportation subject. Generalised from the data models of Takamatsu City's flood-response application.
source: minted            # minted | profile | global
origin:
  repository: https://github.com/geolonia/geonicdb-datamodels
  note: Seeded from two of the seven Custom Data Models of the Takamatsu City flood-prevention headquarters application; the road closure model is RoadRestriction in the transportation subject since 2026-09-25 (#55); the other five (DisasterEvent, IncidentReport, IncidentResponseAction, IncidentHandoverNote, IncidentPhoto) were removed 2026-09-24 as tenant-specific types with no external standard behind them (see docs/design.md, "Versioning and lifecycle").
