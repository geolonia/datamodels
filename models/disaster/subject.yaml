# Subject metadata. One context per subject, versioned; the version below is the
# version of context.jsonld and of every schema in this subject.
name: disaster
version: 2.0.0
title:
  ja: 災害対応
  en: Disaster response
description:
  ja: 自治体の災害対応を表すデータモデル。災害事象、通報、対応業務、申し送り、現地写真、通行止め、避難所運用状況。高松市の水防アプリで実運用されているモデルを汎用化し、2.0.0 でタスク管理サブジェクトの上に組み直したもの（DisasterEvent は Project のエイリアス、通報・対応業務・申し送り・現地写真は Task・Comment・Attachment のサブクラス）。
  en: Data models for municipal disaster response. Disaster event, incident report, response action, handover note, photo, road closure and shelter operation. Generalised from the models in production use in Takamatsu City's flood-response application and rebuilt on the task subject in 2.0.0 (DisasterEvent is an alias of Project; reports, actions, notes and photos are subclasses of Task, Comment and Attachment).
source: minted            # minted | profile | global
origin:
  repository: https://github.com/geolonia/geonicdb-datamodels
  note: Seeded from the seven Custom Data Models of the Takamatsu City flood-prevention headquarters application.
