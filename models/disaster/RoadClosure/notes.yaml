notes:
  - Derived from the Custom Data Models of the Takamatsu City flood-prevention headquarters application (geolonia/geonicdb-datamodels, September 2026). Type names generalised from the tenant-specific "Saitai" prefix; attribute names aligned with the task subject.
  - "From the source application: status → closureStatus, normalised to the RoadSegment value space closed | limited | open, with the local wording in statusLabel (依頼中 is open with the label 依頼中: the road is still passable); area → location (core term; the closed section is the location of the closure); memo → description; the flat town and block fields → address (JapaneseAddress)."
  - "Upstream considered (2026-09-18): Smart Data Models RoadSegment (a network master; a closure is a state of a segment the city does not have), RestrictedTrafficArea (regulation, not an incident) and Alert (a broadcast notice with roadClosed but no road name, alertSource required). None fits as a type. Borrowed: the RoadSegment status value space for closureStatus and the Transportation roadName IRI; validFrom/validTo from Smart Data Models."
