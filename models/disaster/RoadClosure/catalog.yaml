title:
  ja: 通行止め
  en: Road closure
description:
  ja: 通行止め 1 件。路線名、区間（LineString）、状態、期間を持つ。
  en: "One road closure: road name, closed section as a LineString, state and period."
status: draft
tags:
  - disaster-response
  - municipality
attributes:
  project:
    ja: 所属するプロジェクト（タスク管理の Project。災害対応の 1 オペレーションなど）
    en: The task subject's Project this entity belongs to, for example one disaster-response operation
  roadName:
    ja: 路線名
    en: Road name
  address:
    ja: 住所（common サブジェクトの JapaneseAddress 値）
    en: Address, as a JapaneseAddress value from the common subject
  location:
    ja: 通行止め区間（LineString）
    en: The closed section, as a LineString
  closureStatus:
    ja: "正規化した状態。Smart Data Models RoadSegment.status の値域: closed（通行不可）、limited（片側通行など）、open（解除済み、または未実施）。現場の呼び方は statusLabel に"
    en: "Normalised closure state, the value space of Smart Data Models RoadSegment.status: closed (no traffic), limited (traffic possible but not in full capacity), open (closure lifted or not yet in place). The local wording goes in statusLabel"
  statusLabel:
    ja: 本部での状態の呼び方（依頼中、通行止め中、解除済み）
    en: The closure status as the headquarters names it (依頼中, 通行止め中, 解除済み)
  validFrom:
    ja: 通行止め開始
    en: When the closure takes effect
  validTo:
    ja: 解除
    en: When the closure is lifted
  description:
    ja: メモ
    en: Free-text memo
