build_policy:
  security_relevant_flags_present: true
  provenance: {kind: documented, source: "README \"Pre-release exception, until the official launch\""}

build_flags:
  - name: prerelease
    default: "true"
    security_relevant: true
    maintainer_stance: supported
    affects_properties:
      - {property_id: P-PUBLISHED-IMMUTABLE, effect: voids}
      - {property_id: P-HEADERS, effect: narrows}
    provenance: {kind: documented, source: "README \"Pre-release exception, until the official launch\""}
  - name: offline
    default: "used by build:deploy and validate:models"
    security_relevant: true
    maintainer_stance: supported
    affects_properties:
      - {property_id: P-PUBLISHED-IMMUTABLE, effect: narrows}
      - {property_id: P-EXAMPLES-CONFORM, effect: narrows}
    provenance: {kind: documented, source: "package.json build:deploy script"}
  - name: base
    default: "pull-request job only"
    security_relevant: true
    maintainer_stance: supported
    affects_properties:
      - {property_id: P-PUBLISHED-IMMUTABLE, effect: preserves}
    provenance: {kind: documented, source: ".github/workflows/check-worker.yml \"Compare the published versions with the base branch\""}
  - name: preview-builds
    default: "on, branches of this repository only (a dashboard setting)"
    security_relevant: true
    maintainer_stance: supported
    affects_properties:
      - {property_id: P-NO-DEPLOY-CREDENTIAL-IN-GITHUB, effect: preserves}
    provenance: {kind: maintainer, date: "2026-10"}
  - name: mcp-limiter-absent
    default: "present in production and previews"
    security_relevant: false
    maintainer_stance: dev-only
    affects_properties: []
    provenance: {kind: documented, source: "worker/limit.mjs allowed comment: \"No binding (the tests; wrangler dev simulates it): no limit\""}
  - name: CHECK_MACHINE_UA
    default: "unset"
    security_relevant: false
    maintainer_stance: dev-only
    affects_properties: []
    provenance: {kind: documented, source: "docs/deployment.md \"unless CHECK_MACHINE_UA=1 is set\""}
  - name: run_worker_first
    default: "[\"/ns/*\", \"/mcp\"]"
    security_relevant: true
    maintainer_stance: supported
    affects_properties:
      - {property_id: P-NEGOTIATION-FALLBACK, effect: preserves}
    provenance: {kind: documented, source: "wrangler.jsonc assets comment"}

properties_claimed:
  - id: P-PUBLISHED-IMMUTABLE
    kind: integrity
    components: [published-files, build-validation, supply-chain]
    tier: security-critical
    conditions: "after the official launch; exact-version context, vocabulary and schema files"
    violation_symptoms: [integrity-bypass]
    provenance: {kind: documented, source: "docs/design.md \"URL scheme and hosting contract\" item 1"}
  - id: P-TERM-MEANING-STABLE
    kind: correctness
    components: [published-files]
    tier: correctness-only
    conditions: "breaking changes mint new IRIs"
    violation_symptoms: [wrong-output]
    provenance: {kind: documented, source: "docs/design.md \"URL scheme and hosting contract\" item 4"}
  - id: P-ALIAS-ADDITIVE
    kind: correctness
    components: [published-files]
    tier: correctness-only
    conditions: "within a major version"
    violation_symptoms: [wrong-output]
    provenance: {kind: documented, source: "docs/design.md \"URL scheme and hosting contract\" item 6"}
  - id: P-IRI-RESOLVES
    kind: availability
    components: [published-files, iri-negotiation]
    tier: correctness-only
    conditions: "an operator commitment, not an uptime promise"
    violation_symptoms: [x-unresolvable-iri]
    provenance: {kind: documented, source: "docs/design.md \"Decision 1\""}
  - id: P-HEADERS
    kind: correctness
    components: [published-files]
    tier: correctness-only
    conditions: "content types, open CORS, cache lifetimes per class; short cache during the pre-release"
    violation_symptoms: [wrong-output]
    provenance: {kind: documented, source: "docs/design.md \"URL scheme and hosting contract\" item 2"}
  - id: P-CORE-TERMS-PROTECTED
    kind: correctness
    components: [build-validation, published-files]
    tier: correctness-only
    conditions: "every subject context"
    violation_symptoms: [bad-data-accepted]
    provenance: {kind: documented, source: "docs/design.md \"Decision 2\" rules"}
  - id: P-EXAMPLES-CONFORM
    kind: correctness
    components: [build-validation]
    tier: correctness-only
    conditions: "before anything reaches dist/"
    violation_symptoms: [bad-data-accepted]
    provenance: {kind: documented, source: "docs/design.md \"Repository layout\": \"CI on every pull request validates\""}
  - id: P-CONTEXT-IMPORTS-CATALOG
    kind: integrity
    components: [build-validation, published-files]
    tier: security-critical
    conditions: "subject contexts import only catalogue context URLs at a published or current version"
    violation_symptoms: [integrity-bypass]
    provenance: {kind: maintainer, date: "2026-10"}
  - id: P-REFS-CATALOG-ONLY
    kind: correctness
    components: [build-validation, published-files]
    tier: correctness-only
    conditions: "schema $ref targets are catalogue schemas or pointers inside the file; a review rule"
    violation_symptoms: [bad-data-accepted]
    provenance: {kind: maintainer, date: "2026-10"}
  - id: P-NEGOTIATION-FALLBACK
    kind: correctness
    components: [iri-negotiation]
    tier: correctness-only
    conditions: "GET and HEAD for known IRIs; same-origin 303; fallback on any error"
    violation_symptoms: [wrong-output, x-open-redirect]
    provenance: {kind: documented, source: "worker/index.mjs header comment"}
  - id: P-MCP-NO-OUTBOUND
    kind: integrity
    components: [mcp-server]
    tier: security-critical
    conditions: "all four tools"
    violation_symptoms: [x-ssrf]
    provenance: {kind: documented, source: "worker/mcp.mjs header: \"Nothing is fetched from another site\""}
  - id: P-MCP-STATELESS
    kind: confidentiality
    components: [mcp-server]
    tier: security-critical
    conditions: "a fresh server per request; caches hold only public files"
    violation_symptoms: [info-leak]
    provenance: {kind: documented, source: "worker/mcp.mjs header: \"Stateless and without login\""}
  - id: P-MCP-BOUNDED
    kind: resource-bound
    components: [mcp-server]
    tier: correctness-only
    conditions: "64 KiB body, no batches, 1,000 keys, 64 levels, 20 problems; threshold: tens of milliseconds of CPU"
    violation_symptoms: [x-cpu-exhaustion]
    provenance: {kind: documented, source: "worker/validate.mjs header"}
  - id: P-OUTSIDER-TEXT-PLAIN
    kind: output-sanitization
    components: [listings]
    tier: security-critical
    conditions: "extension files and node snapshots"
    violation_symptoms: [x-markup-injection]
    provenance: {kind: documented, source: "scripts/lib/extensions.mjs comment: \"nothing in a file can add markup, a script or a template expression\""}
  - id: P-MODEL-TEXT-ESCAPED
    kind: output-sanitization
    components: [build-validation]
    tier: correctness-only
    conditions: "text from model files on the generated pages"
    violation_symptoms: [x-markup-injection]
    provenance: {kind: documented, source: "scripts/lib/models.mjs mdText comment"}
  - id: P-NO-DEPLOY-CREDENTIAL-IN-GITHUB
    kind: integrity
    components: [supply-chain]
    tier: security-critical
    conditions: "Workers Builds deploys main; builds only branches of this repository"
    violation_symptoms: [integrity-bypass]
    provenance: {kind: documented, source: "docs/deployment.md \"no credential lives in GitHub\""}
  - id: P-CI-TOKENS-SCOPED
    kind: integrity
    components: [supply-chain]
    tier: security-critical
    conditions: "the four workflows in this repository; the organisation's Security Suite workflow is outside this model"
    violation_symptoms: [integrity-bypass]
    provenance: {kind: documented, source: ".github/workflows/similar-models.yml header"}

properties_disclaimed:
  - {id: D-PRERELEASE-CORRECTIONS, components: [published-files, build-validation], conditions: "stated; while prerelease is true, only the current version may be corrected in place; a change to an older release is VALID", tier: security-critical, false_friend: false, provenance: {kind: documented, source: "site/en/guide/urls.md \"Do not reference them from production data before the launch\""}}
  - {id: D-UNVERSIONED-FILES, components: [published-files], conditions: "stated; examples, mapping files, adapter files, catalog.json, llms.txt, MCP index, pages, aliases", tier: correctness-only, false_friend: false, provenance: {kind: documented, source: "docs/design.md \"Adapters\": \"not part of the release snapshots\""}}
  - {id: D-NO-SIGNATURE, components: [published-files], conditions: "stated by maintainer ruling (2026-10); no signatures; the release snapshot in the repository is the reference copy", tier: security-critical, false_friend: false, provenance: {kind: maintainer, date: "2026-10"}}
  - {id: D-CACHE-HINT, components: [published-files], conditions: "stated; Cache-Control immutable is a cache directive", tier: correctness-only, false_friend: true, provenance: {kind: documented, source: "scripts/lib/cache.mjs header"}}
  - {id: D-NO-AVAILABILITY-SLA, components: [published-files, iri-negotiation, mcp-server], conditions: "stated by maintainer ruling (2026-10) for uptime; in docs/design.md for the mirror", tier: correctness-only, false_friend: false, provenance: {kind: maintainer, date: "2026-10"}}
  - {id: D-NO-CONFIDENTIALITY, components: [published-files, iri-negotiation, mcp-server], conditions: "stated; everything public, CORS open", tier: correctness-only, false_friend: false, provenance: {kind: documented, source: "public/_headers header comment: \"Nothing here is private\""}}
  - {id: D-NO-AUTHENTICATION, components: [published-files, mcp-server], conditions: "stated; no login", tier: correctness-only, false_friend: false, provenance: {kind: documented, source: "site/en/ai.md \"It needs no login, only reads\""}}
  - {id: D-BIC-NOT-ACCESS-CONTROL, components: [published-files, mcp-server], conditions: "stated; BIC off on machine paths and /mcp", tier: correctness-only, false_friend: true, provenance: {kind: documented, source: "docs/deployment.md \"Machine-readable files: no Browser Integrity Check\""}}
  - {id: D-RATE-LIMIT-BEST-EFFORT, components: [mcp-server], conditions: "stated; per address or /64, per location, approximate, fails open", tier: correctness-only, false_friend: true, provenance: {kind: documented, source: "worker/limit.mjs allowed comment"}}
  - {id: D-VALIDATE-NOT-ASSURANCE, components: [mcp-server, build-validation], conditions: "stated; schema conformance only, @context not checked", tier: correctness-only, false_friend: true, provenance: {kind: documented, source: "worker/mcp.mjs validate description: \"its @context is not checked\""}}
  - {id: D-PERSONAL-DATA-MARKER, components: [published-files, build-validation], conditions: "stated by maintainer ruling (2026-10); x-personal-data is a marker only", tier: security-critical, false_friend: true, provenance: {kind: maintainer, date: "2026-10"}}
  - {id: D-CONTRIBUTED-FILE-LIMITS, components: [published-files, build-validation], conditions: "stated by maintainer ruling (2026-10); no size, nesting, $ref count, import depth or pattern limit", tier: security-critical, false_friend: false, provenance: {kind: maintainer, date: "2026-10"}}
  - {id: D-AGENT-TEXT, components: [mcp-server, published-files], conditions: "stated by maintainer ruling (2026-10); text reaches agents as written", tier: security-critical, false_friend: false, provenance: {kind: maintainer, date: "2026-10"}}
  - {id: D-LISTED-CONTENT-UNREVIEWED, components: [listings], conditions: "stated; listed as reported, domain not checked", tier: correctness-only, false_friend: true, provenance: {kind: documented, source: "CONTRIBUTING.md \"Adding a listed extension\" steps 3 and 4"}}
  - {id: D-STATUS-NOT-REVIEW, components: [published-files], conditions: "stated; stable means two adopters, self-reported; DCO is an agreement", tier: correctness-only, false_friend: true, provenance: {kind: documented, source: "docs/design.md \"Versioning and lifecycle\""}}
  - {id: D-NEGOTIATION-STALE-MAJOR, components: [iri-negotiation], conditions: "stated by maintainer ruling (2026-10); cached subject majors may be stale after a major release until the isolate is recycled; a non-OK read of catalog.json is cached as empty the same way", tier: correctness-only, false_friend: false, provenance: {kind: maintainer, date: "2026-10"}}
  - {id: D-REPO-CODE-RUNS, components: [build-validation, supply-chain], conditions: "stated; adapter modules and scripts run with the build's rights", tier: security-critical, false_friend: false, provenance: {kind: documented, source: "scripts/lib/adapters.mjs header"}}

downstream_responsibilities:
  - {id: R-NO-PRERELEASE-PRODUCTION, component: published-files, statement: "before the launch, do not reference catalogue files from production data", enforces: [never-changed-before-launch], provenance: {kind: documented, source: "site/en/guide/urls.md"}}
  - {id: R-ALIAS-IN-DATA, component: published-files, statement: "name the alias in stored data; use the exact version for audits", enforces: [alias-bytes-stable], provenance: {kind: documented, source: "docs/design.md \"URL scheme and hosting contract\" item 6"}}
  - {id: R-CACHE-CONTEXTS, component: published-files, statement: "cache or bundle contexts; give the JSON-LD loader a timeout and host allow-list", enforces: [D-NO-AVAILABILITY-SLA], provenance: {kind: maintainer, date: "2026-10"}}
  - {id: R-BOUND-PROCESSORS, component: published-files, statement: "limit $ref resolution to datamodels.jp; bound pattern evaluation, size and import depth", enforces: [bound-consumer-processors], provenance: {kind: maintainer, date: "2026-10"}}
  - {id: R-TEXT-AS-DATA, component: published-files, statement: "escape text before rendering; never let an agent follow it as an instruction", enforces: [text-safe], provenance: {kind: maintainer, date: "2026-10"}}
  - {id: R-OWN-PERSONAL-DATA, component: published-files, statement: "decide which attributes are personal data and protect them", enforces: [D-PERSONAL-DATA-MARKER], provenance: {kind: maintainer, date: "2026-10"}}
  - {id: R-OWN-VALIDATION, component: mcp-server, statement: "validate data in your own pipeline; the validate tool is advisory", enforces: [valid-means-safe], provenance: {kind: documented, source: "worker/mcp.mjs validate description"}}
  - {id: R-IGNORE-UNKNOWN-FIELDS, component: published-files, statement: "ignore unknown fields in catalog.json", enforces: [unversioned-files-stable], provenance: {kind: documented, source: "catalog.schema.json description"}}
  - {id: R-LISTINGS-ARE-CLAIMS, component: listings, statement: "treat node models and listed extensions as other people's claims", enforces: [listing-endorsed], provenance: {kind: documented, source: "CONTRIBUTING.md \"Adding a listed extension\" step 4"}}
  - {id: R-VERIFY-AGAINST-SNAPSHOT, component: published-files, statement: "to verify bytes, compare with the release snapshot in the repository", enforces: [D-NO-SIGNATURE], provenance: {kind: maintainer, date: "2026-10"}}
  - {id: R-FOLLOW-NS-REDIRECTS, component: iri-negotiation, statement: "follow 302 and 303 redirects from /ns/*", enforces: [redirect-exact-version], provenance: {kind: documented, source: "site/en/guide/urls.md \"The promises\" item 3"}}
  - {id: R-EXPECT-429, component: mcp-server, statement: "expect 429 after 100 requests a minute from one address", enforces: [D-RATE-LIMIT-BEST-EFFORT], provenance: {kind: documented, source: "docs/deployment.md \"/mcp is rate-limited\""}}
  - {id: R-OPERATOR-ZONE-RULE, component: supply-chain, statement: "operator keeps the BIC rule and runs check:live after a deploy", enforces: [D-BIC-NOT-ACCESS-CONTROL], provenance: {kind: documented, source: "docs/deployment.md \"After a deploy, run npm run check:live\""}}
  - {id: R-OPERATOR-DOMAIN, component: supply-chain, statement: "operator keeps datamodels.jp registered and the zone in the same account", enforces: [P-IRI-RESOLVES], provenance: {kind: documented, source: "docs/design.md \"Decision 1\""}}
  - {id: R-OPERATOR-BUILDS, component: supply-chain, statement: "operator keeps Workers Builds on main, previews only for own branches, preview_urls true", enforces: [P-NO-DEPLOY-CREDENTIAL-IN-GITHUB], provenance: {kind: documented, source: "docs/deployment.md"}}
  - {id: R-OPERATOR-LIMIT-SYNC, component: mcp-server, statement: "operator keeps RATE_LIMIT equal to both MCP_LIMITER declarations", enforces: [D-RATE-LIMIT-BEST-EFFORT], provenance: {kind: documented, source: "wrangler.jsonc ratelimits comment"}}
  - {id: R-OPERATOR-RETIRED-PREVIEW, component: supply-chain, statement: "operator keeps models.geonicdb.com detached", enforces: [P-IRI-RESOLVES], provenance: {kind: documented, source: "docs/deployment.md"}}
  - {id: R-OPERATOR-LAUNCH, component: published-files, statement: "at the launch, set prerelease: false", enforces: [P-PUBLISHED-IMMUTABLE], provenance: {kind: documented, source: "README \"Pre-release exception\""}}
  - {id: R-OPERATOR-GREEN-MERGE, component: supply-chain, statement: "merge only after the pull-request check is green", enforces: [P-PUBLISHED-IMMUTABLE], provenance: {kind: maintainer, date: "2026-10"}}

known_misuses:
  - {id: M-PIN-PRERELEASE, components: [published-files], pattern: "pinning a pre-release exact version and its hash for integrity", safer_alternative: "wait for the launch or keep your own copy", provenance: {kind: documented, source: "README \"Pre-release exception\""}}
  - {id: M-FETCH-WITHOUT-CACHE, components: [published-files], pattern: "fetching contexts on every request without a cache", safer_alternative: "cache or bundle contexts", provenance: {kind: maintainer, date: "2026-10"}}
  - {id: M-VALID-AS-SAFE, components: [mcp-server, build-validation], pattern: "reading valid: true as safe", safer_alternative: "escape and authorise in your own system", provenance: {kind: documented, source: "worker/mcp.mjs validate description"}}
  - {id: M-MARKER-AS-COMPLIANCE, components: [published-files], pattern: "reading x-personal-data as a compliance statement", safer_alternative: "decide per attribute", provenance: {kind: maintainer, date: "2026-10"}}
  - {id: M-LISTING-AS-ENDORSEMENT, components: [listings], pattern: "trusting an extension's IRIs because the catalogue lists them", safer_alternative: "check the owner's domain", provenance: {kind: documented, source: "CONTRIBUTING.md \"Adding a listed extension\" step 3"}}
  - {id: M-AGENT-FOLLOWS-TEXT, components: [mcp-server], pattern: "an agent acting on an instruction found in catalogue text", safer_alternative: "treat answers as data", provenance: {kind: maintainer, date: "2026-10"}}
  - {id: M-ALIAS-FOR-AUDIT, components: [published-files], pattern: "recording the alias as the definition used for a decision", safer_alternative: "record the exact version", provenance: {kind: documented, source: "docs/design.md \"URL scheme and hosting contract\" item 6"}}

known_non_findings:
  - {id: KNF-CORS-WILDCARD, components: [published-files, mcp-server], symptom: cors-misconfiguration, tool_pattern: "Access-Control-Allow-Origin: * on every response", conditions: "a published file or an MCP answer; no cookie or credential involved", discharged_by: [D-NO-CONFIDENTIALITY], provenance: {kind: documented, source: "public/_headers header comment"}}
  - {id: KNF-MCP-NO-AUTH, components: [mcp-server], symptom: missing-authentication, tool_pattern: "the MCP endpoint accepts requests without a token", conditions: "one of the four read-only tools", discharged_by: [D-NO-AUTHENTICATION], provenance: {kind: documented, source: "site/en/ai.md \"It needs no login, only reads\""}}
  - {id: KNF-NS-SAME-ORIGIN, components: [iri-negotiation], symptom: open-redirect, tool_pattern: "/ns/ redirects, so it is an open redirect", conditions: "Location is a same-origin path: the 303 to /vocab/<subject>/v<major>.jsonld or a generated 302", discharged_by: [P-NEGOTIATION-FALLBACK], provenance: {kind: documented, source: "worker/index.mjs header"}}
  - {id: KNF-PRERELEASE-CORRECTION, components: [published-files], symptom: integrity-change, tool_pattern: "a v1.0.0 file changed after it was published", conditions: "prerelease: true on the base branch and the change; the file belongs to the subject's current version", discharged_by: [D-PRERELEASE-CORRECTIONS], provenance: {kind: documented, source: "README \"Pre-release exception, until the official launch\""}}
  - {id: KNF-RATE-LIMIT-SHARED, components: [mcp-server], symptom: rate-limit-bypass, tool_pattern: "the limit can be exceeded from several locations or addresses, or hosted-connector users block each other", conditions: "several Cloudflare locations, several /64 blocks, or one provider's shared addresses", discharged_by: [D-RATE-LIMIT-BEST-EFFORT], provenance: {kind: documented, source: "docs/deployment.md \"Hosted connectors\""}}
  - {id: KNF-BIC-OFF, components: [published-files, mcp-server], symptom: missing-bot-protection, tool_pattern: "Browser Integrity Check disabled on machine paths and /mcp", conditions: "the path is in the zone rule's expression", discharged_by: [D-BIC-NOT-ACCESS-CONTROL], provenance: {kind: documented, source: "docs/deployment.md \"Machine-readable files: no Browser Integrity Check\""}}

